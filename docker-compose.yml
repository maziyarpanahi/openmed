services:
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      OPENMED_PROFILE: ${OPENMED_PROFILE:-prod}
      OPENMED_CACHE_DIR: ${OPENMED_CACHE_DIR:-/root/.cache/huggingface/openmed}
      OPENMED_SERVICE_PRELOAD_MODELS: ${OPENMED_SERVICE_PRELOAD_MODELS:-}
      OPENMED_SERVICE_MAX_RESIDENT_MODELS: ${OPENMED_SERVICE_MAX_RESIDENT_MODELS:-}
      OPENMED_SERVICE_LIMIT_CONCURRENCY: ${OPENMED_SERVICE_LIMIT_CONCURRENCY:-128}
      OPENMED_SERVICE_TIMEOUT_KEEP_ALIVE: ${OPENMED_SERVICE_TIMEOUT_KEEP_ALIVE:-5}
      OPENMED_SERVICE_TIMEOUT_GRACEFUL_SHUTDOWN: ${OPENMED_SERVICE_TIMEOUT_GRACEFUL_SHUTDOWN:-30}
      OPENMED_SERVICE_REQUEST_BODY_TIMEOUT_SECONDS: ${OPENMED_SERVICE_REQUEST_BODY_TIMEOUT_SECONDS:-60}
      OPENMED_SERVICE_REQUEST_BODY_GRACE_SECONDS: ${OPENMED_SERVICE_REQUEST_BODY_GRACE_SECONDS:-10}
      OPENMED_SERVICE_REQUEST_BODY_MIN_BYTES_PER_SECOND: ${OPENMED_SERVICE_REQUEST_BODY_MIN_BYTES_PER_SECOND:-1024}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command:
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --streamable-http-path
      - /mcp
    ports:
      - "127.0.0.1:${OPENMED_MCP_PORT:-8081}:8081"
    environment:
      OPENMED_PROFILE: ${OPENMED_PROFILE:-prod}
      OPENMED_CACHE_DIR: ${OPENMED_CACHE_DIR:-/root/.cache/huggingface/openmed}
      OPENMED_SERVICE_KEEP_ALIVE: ${OPENMED_SERVICE_KEEP_ALIVE:-10m}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 8081), 3).close()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  hf-cache:
