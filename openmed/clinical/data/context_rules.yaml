# OpenMed's starter ConText rule set.
#
# Provenance: common English trigger patterns adapted from the NegEx and
# medspaCy ConText lexicon traditions. Those upstream projects publish their
# reusable rule implementations and lexicons under Apache-2.0-compatible
# terms. This compact adaptation is maintained with OpenMed under Apache-2.0;
# it contains no patient data or restricted clinical terminology.
#
# These deterministic rules are the default shared primitive. Learned context
# heads may be added by later layers only for axes and cases where rules
# demonstrably under-perform; this file does not make per-axis decisions.

schema_version: 1
provenance:
  sources:
    - NegEx trigger lexicon
    - medspaCy ConText rules
  license: Apache-2.0
  adaptation: OpenMed-maintained English starter cues; no clinical corpus data
  restricted_data: false

rules:
