apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openmed-service
  labels:
    app.kubernetes.io/name: openmed-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openmed-service
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Pods
      pods:
        metric:
          name: openmed_service_admission_queue_depth
        target:
          type: AverageValue
          averageValue: "4"
    - type: Pods
      pods:
        metric:
          name: openmed_service_inflight_requests
        target:
          type: AverageValue
          averageValue: "8"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
