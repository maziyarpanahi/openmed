# Number of OpenMed REST service pods to run.
replicaCount: 1

# Container image settings for the OpenMed REST service.
image:
  # Image repository to deploy.
  repository: openmed
  # Image tag to deploy. Defaults to Chart.appVersion when left empty.
  tag: "3.2.0"
  # Kubernetes image pull policy.
  pullPolicy: IfNotPresent

# Optional image pull secrets for private image registries.
imagePullSecrets: []

# Optional short name override for generated Kubernetes object names.
nameOverride: ""

# Optional full name override for generated Kubernetes object names.
fullnameOverride: ""

# Extra labels added to pods.
podLabels: {}

# Extra annotations added to pods.
podAnnotations: {}

# Pod-level security context for every API pod, with or without Journey.
# The defaults run as the image's fixed non-root UID/GID 65532 with the
# RuntimeDefault seccomp profile; fsGroup makes mounted volumes group-writable.
# Helm merges overrides key by key, so `podSecurityContext: {}` keeps these
# defaults. Weakening one requires setting that key explicitly (for example to
# `false` or `null`), and the chart tests flag every weakened render.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Container-level security context for the API container. The root filesystem
# is read-only; the only writable paths are the volumes declared under
# `writableVolumes`, `persistence` and, with Journey, the artifact store.
# The same key-by-key override rule as `podSecurityContext` applies.
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Writable emptyDir volumes that keep the read-only root filesystem usable.
writableVolumes:
  # HOME of the non-root image user, exported as HOME. Small library config
  # files land here; the cache directory below it is the model-cache volume.
  home:
    mountPath: /home/nonroot
    sizeLimit: 128Mi
  # Scratch space mounted at /tmp and exported as TMPDIR.
  tmp:
    sizeLimit: 512Mi
  # emptyDir that backs the model-cache mount when persistence.enabled is
  # false. Empty means no size limit.
  modelCache:
    sizeLimit: 20Gi

# How long Kubernetes waits for graceful shutdown after SIGTERM.
terminationGracePeriodSeconds: 45

# REST service configuration rendered into a ConfigMap.
config:
  # OpenMed configuration profile.
  profile: prod
  # OPENMED_CACHE_DIR for data and deployment workflows that read it. It sits
  # on the model-cache volume next to the default OpenMed model cache.
  cacheDir: /home/nonroot/.cache/openmed
  # HF_HOME for Hugging Face Hub files, on the model-cache volume.
  hfHome: /home/nonroot/.cache/huggingface
  # Models to preload before readiness flips to ready.
  preloadModels: []
  # Maximum resident models in the warm pool. Empty means unbounded.
  maxResidentModels: ""
  # Default model keep-alive duration. Empty means indefinite caching.
  keepAlive: 10m
  # Maximum request text length accepted by model-backed endpoints.
  maxTextLength: "1000000"
  # Exact browser origins allowed for CORS. Empty disables browser CORS.
  corsOrigins: []
  # Additional trusted Host header values. The chart also adds loopback and
  # generated Kubernetes service DNS names automatically.
  trustedHosts: []
  # Dynamic request batching for compatible /analyze and /pii/extract traffic.
  batching:
    enabled: false
    maxSize: 8
    maxWaitMs: 5
    maxQueueSize: 256
    highWatermark: 256
    lowWatermark: 128
    maxQueueWaitMs: 1000
  # Request coalescing for identical concurrent model-backed requests.
  coalescing:
    enabled: false
  # Graceful shutdown drain timeout in seconds.
  shutdownDrainSeconds: 30
  # Optional pull-only Prometheus metrics endpoint.
  metrics:
    enabled: false
  # In-process rate and concurrency limits for model-backed endpoints.
  throttle:
    rateLimitRps: 0
    rateLimitBurst: 0
    maxConcurrency: 0
    concurrencyWaitSeconds: 0.05
    keyBy: global

# Additional environment variables appended directly to the container.
# Use this for secretKeyRef/configMapKeyRef entries such as HF_TOKEN.
extraEnv: []

# HTTP service settings.
service:
  # Kubernetes Service type.
  type: ClusterIP
  # Service port exposed inside the cluster.
  port: 8080
  # Container port where Uvicorn listens.
  targetPort: 8080
  # Extra annotations added to the Service.
  annotations: {}

# Readiness and liveness probe settings.
probes:
  liveness:
    path: /livez
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Resource requests and limits for the service container.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

# Persistent model cache volume settings.
persistence:
  # Create or mount a PersistentVolumeClaim for model cache reuse. When false,
  # the same mount path is backed by the writableVolumes.modelCache emptyDir.
  enabled: true
  # Existing PVC name to mount instead of creating one.
  existingClaim: ""
  # StorageClass name for the generated PVC. Empty uses the cluster default.
  storageClassName: ""
  # PVC access modes.
  accessModes:
    - ReadWriteOnce
  # Requested PVC size.
  size: 20Gi
  # Cache mount path inside the container: the non-root user's cache
  # directory, which holds the OpenMed model cache (~/.cache/openmed), the
  # service job store and the Hugging Face cache (~/.cache/huggingface).
  mountPath: /home/nonroot/.cache
  # Optional subPath for the mounted PVC.
  subPath: ""
  # Extra annotations added to the generated PVC.
  annotations: {}

# Optional node selector for pod scheduling.
nodeSelector: {}

# Optional tolerations for pod scheduling.
tolerations: []

# Optional affinity rules for pod scheduling.
affinity: {}

# Extra volumes added to the pod.
extraVolumes: []

# Extra volume mounts added to the service container.
extraVolumeMounts: []

# Production Journey profile. The referenced Secret must be created by the
# operator of the cluster; the chart never creates or renders database values.
journey:
  enabled: false
  schema: openmed_journey
  database:
    secretName: openmed-journey-database
    secretKey: dsn
  artifacts:
    existingClaim: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    mountPath: /var/lib/openmed/artifacts
    annotations: {}
  migration:
    backoffLimit: 3
    ttlSecondsAfterFinished: 86400
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  worker:
    replicas: 1
    port: 8091
    intervalSeconds: 10
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  networkPolicy:
    enabled: true
    allowDns: true
    # Label selector for an in-cluster PostgreSQL pod. Keep empty for an
    # external database and provide a reviewed additionalEgress rule instead.
    databasePodSelector: {}
    databaseNamespaceSelector: {}
    additionalEgress: []
