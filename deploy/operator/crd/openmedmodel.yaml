apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openmedmodels.openmed.ai
  labels:
    app.kubernetes.io/name: openmed-operator
    app.kubernetes.io/part-of: openmed
spec:
  group: openmed.ai
  scope: Namespaced
  names:
    plural: openmedmodels
    singular: openmedmodel
    kind: OpenMedModel
    listKind: OpenMedModelList
    shortNames:
      - omm
    categories:
      - all
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Family
          type: string
          jsonPath: .spec.family
        - name: Tier
          type: string
          jsonPath: .spec.tier
        - name: Desired
          type: string
          jsonPath: .spec.version
        - name: Active
          type: string
          jsonPath: .status.activeVersion
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              additionalProperties: false
              required:
                - family
                - version
                - tier
                - replicas
                - rolloutStrategy
              properties:
                family:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[A-Za-z](?:[A-Za-z0-9._-]{0,61}[A-Za-z0-9])?$'
                  description: Logical OpenMed model family.
                version:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._:@/+~-]{0,252}$'
                  description: >-
                    Immutable model manifest pointer or local model path passed
                    to OPENMED_SERVICE_PRELOAD_MODELS.
                tier:
                  type: string
                  enum:
                    - Tiny
                    - Small
                    - Medium
                    - Base
                    - Large
                    - XLarge
                    - Accurate-XLarge
                  description: Published OpenMed model size/device tier.
                replicas:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 1000
                  description: Desired replica count for the target Deployment.
                targetRef:
                  type: object
                  additionalProperties: false
                  description: >-
                    Existing OpenMed REST Deployment to manage. The resource
                    name and openmed-service container are used by default.
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: >-
                        ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$
                    containerName:
                      type: string
                      minLength: 1
                      maxLength: 63
                      pattern: '^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$'
                manifestConfigMapName:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: >-
                    ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?)*$
                  description: >-
                    Optional ConfigMap name for the operator-owned manifest
                    pointer. Defaults to <resource>-model-manifest.
                rolloutStrategy:
                  type: object
                  additionalProperties: false
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum:
                        - RollingUpdate
                        - Recreate
                    maxUnavailable:
                      x-kubernetes-int-or-string: true
                      anyOf:
                        - type: integer
                          minimum: 0
                        - type: string
                          pattern: '^(?:0|[1-9][0-9]{0,2})%$'
                      default: 0
                    maxSurge:
                      x-kubernetes-int-or-string: true
                      anyOf:
                        - type: integer
                          minimum: 0
                        - type: string
                          pattern: '^(?:0|[1-9][0-9]{0,2})%$'
                      default: 1
                    rollbackOnFailure:
                      type: boolean
                      default: true
                    progressDeadlineSeconds:
                      type: integer
                      format: int32
                      minimum: 1
                      default: 600
              x-kubernetes-validations:
                - rule: >-
                    self.rolloutStrategy.type != 'RollingUpdate' ||
                    !((!has(self.rolloutStrategy.maxUnavailable) ||
                    self.rolloutStrategy.maxUnavailable == 0 ||
                    self.rolloutStrategy.maxUnavailable == '0%') &&
                    (!has(self.rolloutStrategy.maxSurge) ||
                    self.rolloutStrategy.maxSurge == 0 ||
                    self.rolloutStrategy.maxSurge == '0%'))
                  message: >-
                    RollingUpdate cannot set both maxUnavailable and maxSurge
                    to zero.
            status:
              type: object
              additionalProperties: false
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                  enum:
                    - Pending
                    - RollingOut
                    - Ready
                    - Failed
                    - RolledBack
                desiredVersion:
                  type: string
                activeVersion:
                  type: string
                  nullable: true
                desiredSpecHash:
                  type: string
                appliedSpecHash:
                  type: string
                  nullable: true
                failedSpecHash:
                  type: string
                  nullable: true
                manifestHash:
                  type: string
                targetDeploymentGeneration:
                  type: integer
                  format: int64
                  nullable: true
                rollbackCount:
                  type: integer
                  format: int32
                  minimum: 0
                rollbackRequest:
                  type: string
                  nullable: true
                lastSuccessfulSpec:
                  type: object
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                previousSuccessfulSpec:
                  type: object
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                rollbackSpec:
                  type: object
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - observedGeneration
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
