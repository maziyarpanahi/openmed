apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openmed-operator
  labels:
    app.kubernetes.io/name: openmed-operator
    app.kubernetes.io/part-of: openmed
rules:
  - apiGroups:
      - openmed.ai
    resources:
      - openmedmodels
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - openmed.ai
    resources:
      - openmedmodels/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - openmed.ai
    resources:
      - openmedmodels/finalizers
    verbs:
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - create
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
