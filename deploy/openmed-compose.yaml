# Local-first Journey deployment profile. Set OPENMED_POSTGRES_PASSWORD before
# startup; the value is never persisted in this file or emitted by health tools.

x-openmed-image: &openmed-image
  image: "${OPENMED_IMAGE:-openmed:distroless}"
  pull_policy: never
  build:
    context: ..
    dockerfile: deploy/docker/Dockerfile.distroless

x-openmed-security: &openmed-security
  user: "65532:65532"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512

x-openmed-environment: &openmed-environment
  OPENMED_PROFILE: "${OPENMED_PROFILE:-prod}"
  OPENMED_OFFLINE: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"
  HF_HOME: /cache/huggingface
  HF_HUB_CACHE: /cache/huggingface/hub
  TRANSFORMERS_CACHE: /cache/huggingface/transformers
  OPENMED_CACHE_DIR: /cache/openmed
  OPENMED_JOURNEY_ARTIFACT_ROOT: /cache/artifacts
  OPENMED_JOURNEY_POSTGRES_DSN: >-
    postgresql://openmed:${OPENMED_POSTGRES_PASSWORD:?set OPENMED_POSTGRES_PASSWORD}@postgres:5432/openmed
  OPENMED_JOURNEY_SCHEMA: "${OPENMED_JOURNEY_SCHEMA:-openmed_journey}"

services:
  postgres:
    image: "${OPENMED_POSTGRES_IMAGE:-postgres:17-alpine}"
    pull_policy: "${OPENMED_POSTGRES_PULL_POLICY:-missing}"
    environment:
      POSTGRES_DB: openmed
      POSTGRES_USER: openmed
      POSTGRES_PASSWORD: "${OPENMED_POSTGRES_PASSWORD:?set OPENMED_POSTGRES_PASSWORD}"
    volumes:
      - openmed-postgres:/var/lib/postgresql/data
    networks:
      - openmed-internal
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmed -d openmed"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  journey-migrate:
    <<: [*openmed-image, *openmed-security]
    entrypoint: ["/usr/bin/tini", "--", "/usr/bin/python3", "-m", "openmed.deploy.journey"]
    command: ["migrate"]
    environment:
      <<: *openmed-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openmed-internal
    restart: "no"

  journey-worker:
    <<: [*openmed-image, *openmed-security]
    entrypoint: ["/usr/bin/tini", "--", "/usr/bin/python3", "-m", "openmed.deploy.journey"]
    command: ["worker", "--host", "0.0.0.0", "--port", "8091"]
    environment:
      <<: *openmed-environment
    volumes:
      - openmed-cache:/cache
    depends_on:
      journey-migrate:
        condition: service_completed_successfully
    networks:
      - openmed-internal
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8091/readyz", timeout=3).read()
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  openmed:
    <<: [*openmed-image, *openmed-security]
    ports:
      - "${OPENMED_BIND_ADDRESS:-127.0.0.1}:${OPENMED_PORT:-8080}:8080"
    environment:
      <<: *openmed-environment
      OPENMED_SERVICE_PRELOAD_MODELS: "${OPENMED_SERVICE_PRELOAD_MODELS:-}"
      OPENMED_SERVICE_KEEP_ALIVE: "${OPENMED_SERVICE_KEEP_ALIVE:-10m}"
      OPENMED_SERVICE_MAX_RESIDENT_MODELS: "${OPENMED_SERVICE_MAX_RESIDENT_MODELS:-}"
      OPENMED_SERVICE_TRUSTED_HOSTS: "${OPENMED_SERVICE_TRUSTED_HOSTS:-localhost,127.0.0.1}"
      OPENMED_SERVICE_PRIVACY_GATEWAY_ENDPOINT: ""
      OPENMED_SERVICE_METRICS_ENABLED: "false"
      OPENMED_SERVICE_TRACING_ENABLED: "false"
      OPENMED_SERVICE_OTLP_ENDPOINT: ""
      OPENMED_OPENHIM_MEDIATOR_ENABLED: "false"
    volumes:
      - openmed-cache:/cache
      - openmed-models:/models:ro
    depends_on:
      journey-migrate:
        condition: service_completed_successfully
      journey-worker:
        condition: service_healthy
    stop_grace_period: 45s
    networks:
      - openmed-internal
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -m
        - openmed.deploy.journey
        - probe
        - --worker-url
        - http://journey-worker:8091/readyz
        - --model-url
        - http://127.0.0.1:8080/readyz
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  journey-golden:
    <<: [*openmed-image, *openmed-security]
    profiles: ["smoke"]
    entrypoint: ["/usr/bin/tini", "--", "/usr/bin/python3", "-m", "openmed.deploy.journey"]
    command: ["golden"]
    environment:
      <<: *openmed-environment
    volumes:
      - openmed-cache:/cache
    depends_on:
      openmed:
        condition: service_healthy
    networks:
      - openmed-internal
    restart: "no"

  mcp:
    <<: [*openmed-image, *openmed-security]
    profiles: ["mcp"]
    entrypoint: ["/usr/bin/tini", "--", "/usr/bin/python3", "-m", "openmed.mcp.server"]
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      <<: *openmed-environment
      OPENMED_MCP_ALLOW_INSECURE_LOCALHOST: "1"
    volumes:
      - openmed-cache:/cache
      - openmed-models:/models:ro
    depends_on:
      openmed:
        condition: service_healthy
    networks:
      - openmed-internal
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - >-
          import socket;
          s=socket.create_connection(("127.0.0.1",8081),3);s.close()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  openmed-cache:
    name: "${OPENMED_CACHE_VOLUME_NAME:-openmed-cache}"
  openmed-models:
    name: "${OPENMED_MODEL_VOLUME_NAME:-openmed-models}"
  openmed-postgres:
    name: "${OPENMED_POSTGRES_VOLUME_NAME:-openmed-postgres}"

networks:
  openmed-internal:
    internal: true
