[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmed"
dynamic = ["version"]
description = "Local-first SDK for clinical extraction and de-identification workflows on hardware you control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = [
  "biomedical",
  "clinical",
  "NLP",
  "LLM",
  "healthcare",
  "medical",
  "natural language processing",
  "medical language models",
  "medical LLMs",
  "medical NLP",
  "medical NER",
  "medical de-identification",
  "medical extraction",
  "medical reasoning",
]
dependencies = [
  "pysbd>=0.3.4,<0.4",
  "faker>=40.36.0",
  "jieba>=0.42.1,<0.43",
  "pyyaml>=6.0.3",
]

authors = [
  { name = "Maziyar Panahi" }
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.6.1",
  "cryptography>=50,<51",
  "rich>=15.0.0",
  "typer>=0.27.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "huggingface-hub>=1.27.0",
  "jsonschema>=4.26.0",
  "mypy==2.3.0",
  "opencc>=1.4.1,<2",
  "Pillow==12.3.0",
  "duckdb>=1.5.5,<2",
  "numpy>=2.2.6",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "dask[dataframe]>=2026.7.1",
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
  "opentelemetry-sdk>=1.44.0,<2",
  "pandas>=2.3.3",
  "polars>=1.43.2",
  "python-dateutil>=2.9.0.post0",
  "hypothesis>=6.165.2",
  "fsspec>=2026.7.0",
  "fonttools[woff]==4.63.0",
  "grpcio>=1.83.0",
  "grpcio-tools>=1.83.0",
  "protobuf>=7.35.1,<8",
  "ruff==0.16.2",
  "tomli>=2.0; python_version < '3.11'",
]

cli = [
  "rich>=15.0.0",
  "typer>=0.27.1",
]

integrity = [
  "cryptography>=50,<51",
]

mcp = [
  "mcp>=2.0.0,<3",
]

lid = [
  "pycld2>=0.42,<1",
]

openmrs = [
  "httpx>=0.28.1",
]

presidio = [
  "presidio-analyzer>=2.2.364,<3",
]

philter = [
  "philter-ucsf>=1.0.3,<2",
]

pydeid = [
  "pyDeid>=0.0.1",
]

scrubadub = [
  "scrubadub>=2.0.1,<3",
]

pandas = [
  "pandas>=2.3.3",
]

polars = [
  "polars>=1.43.2",
]

columnar = [
  "pyarrow>=25.0.0",
]

dask = [
  "dask[dataframe]>=2026.7.1",
]

spacy = [
  "click>=8.4.2",
  "spacy>=3.8.15",
]

zh = [
  "jieba>=0.42",
  "opencc>=1.4.1,<2",
  "pypinyin>=0.55.0",
]

indic = [
  "indic-nlp-library>=0.92",
]

scispacy = [
  "scispacy>=0.6.2,<1",
]

quickumls = [
  "quickumls>=1.4.2,<2",
]

# sdcMicro and R are installed separately under GPL-2.0. This explicit extra
# opts into the subprocess-only bridge without adding GPL code or dependencies.
interop-gpl = []

multimodal = [
  "numpy>=2.2.6",
  "onnx>=1.22.0",
  "pdfplumber>=0.11.10",
  "python-docx>=1.2.0",
  "Pillow>=10.0",
  "python-doctr>=1.0.1",
  "piexif>=1.1.3",
  "pikepdf>=10.11.0",
  "pydicom>=3.0.2",
  "pytesseract>=0.3.13",
  "markdown-it-py>=4.2.0,<5",
  "easyocr>=1.7.2",
]

# PaddleOCR is a heavy, platform-sensitive backend (pulls in paddlepaddle), so
# it is opt-in rather than bundled into the general multimodal extra.
ocr-paddle = [
  "paddleocr>=3.7.0",
]

zh-pkuseg = [
  "pkuseg>=0.0.25,<0.1",
]

zh-hanlp = [
  "hanlp>=2.1.3,<3",
]

awq = [
  "autoawq==0.2.9; sys_platform == 'linux'",
  "transformers==5.14.1; sys_platform == 'linux'",
]

gptq = [
  "auto-gptq>=0.7.1",
]

grounding = [
  "rapidfuzz>=3.14.5,<4",
  "hnswlib>=0.8,<1",
  "numpy>=2.2.6",
]

langchain = [
  "langchain-core>=1.5.3,<2",
]

langgraph = [
  "langgraph>=1.2.10,<2",
]

haystack = [
  "haystack-ai>=3.0.0,<4",
]

llamaindex = [
  "llama-index-core>=0.14.23,<1",
]

agents = [
  "langchain-core>=1.5.3,<2",
  "langgraph>=1.2.10,<2",
  "llama-index-core>=0.14.23,<1",
]

beam = [
  "apache-beam>=2.75.0,<3",
]

duckdb = [
  "duckdb>=1.5.5,<2",
  "numpy>=2.2.6",
]

kafka = [
  "confluent-kafka>=2.15.0",
]

prefect = [
  "prefect>=3.8.2,<4",
]

cloud = [
  "fsspec>=2026.7.0",
  "s3fs>=2026.7.0",
  "gcsfs>=2026.7.0",
  "adlfs>=2026.5.0",
]

ray = [
  "ray[data]>=2.56.1,<3",
]

spark = [
  "pyspark>=4.2.0,<5",
  "pandas>=2.3.3",
  "pyarrow>=25.0.0",
]

hf = [
  "transformers>=5.14.1",
  "huggingface-hub>=1.27.0",
  "accelerate>=1.14.0",
  "tokenizers>=0.23.1"
]

service = [
  "fastapi>=0.141.1",
  "grpcio>=1.83.0",
  "httpx>=0.28.1",
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
  "opentelemetry-sdk>=1.44.0,<2",
  "protobuf>=7.35.1,<8",
  "uvicorn[standard]>=0.52.1",
]

gliner = [
  "gliner[tokenizers]>=0.2.28",
  "torch>=2.13.0"
]

mlx = [
  "mlx>=0.32.0",
  "mlx-lm>=0.31.3",
  "huggingface-hub>=1.27.0",
  "transformers>=5.14.1",
  "tokenizers>=0.23.1",
  "safetensors>=0.8.0",
  "tiktoken>=0.13.0",
]

coreml = [
  "coremltools>=9.0",
  "huggingface-hub>=1.27.0",
  "torch>=2.13.0",
  "transformers>=5.14.1",
]

onnx = [
  "onnx>=1.22.0",
  "onnxruntime>=1.24.3",
  "onnxscript>=0.7.1",
  "torch>=2.13.0",
  "transformers>=5.14.1",
]

onnx-runtime = [
  "huggingface-hub>=1.27.0",
  "numpy>=2.2.6",
  "onnxruntime>=1.24.3",
  "tokenizers>=0.23.1",
]

openvino = [
  "openvino>=2026.3.0",
  "nncf>=3.3.0",
  "onnxruntime>=1.24.3",
  "transformers>=5.14.1",
]

docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.7",
  "mkdocs-git-revision-date-localized-plugin>=1.5.3",
  "mkdocs-llmstxt>=0.5.0,<1",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocs-static-i18n>=1.3.1,<2",
  "pymdown-extensions>=11.0.1,<12",
  "gitpython>=3.1.58,<4",
  "mkdocstrings[python]",
  "griffe",
]

yasbd = [
  "yasbd-lib>=0.13.1,<0.14",
]

[project.scripts]
openmed = "openmed.cli:main"
openmed-mcp = "openmed.mcp.server:main"

[tool.uv]
constraint-dependencies = [
  "betterproto==2.0.0b6; python_version >= '3.11'",
]
override-dependencies = [
  # Beam 2.75 caps these below their patched releases even though its
  # DirectRunner remains compatible with the secure versions.
  "cryptography>=50,<51",
  "httplib2>=0.32",
]
conflicts = [
  [
    { extra = "awq" },
    { extra = "gliner" },
  ],
  [
    { extra = "onnx" },
    { extra = "scispacy" },
  ],
  [
    { extra = "multimodal" },
    { extra = "scispacy" },
  ],
]

[tool.hatch.build]
include = [
  "/openmed/**",
  "/openmed/py.typed",
  "/openmed/core/thresholds.json",
  "/openmed/core/policies/*.json",
  "/openmed/core/schemas/json/*.json",
  "/openmed/risk/data/*.json",
  "/eval/redteam/corpus/adversarial_phi.jsonl",
  "/gates/baseline.json",
  "/gates/registry_state.json",
  "/models.jsonl",
  "/models.jsonl.sigstore.json",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml"
]

[tool.hatch.build.targets.wheel.force-include]
"eval/redteam/corpus/adversarial_phi.jsonl" = "openmed/eval/data/adversarial_phi.jsonl"

[tool.hatch.version]
path = "openmed/__about__.py"

[tool.hatch.publish.index]
disable = false

[tool.hatch.publish.index.repos]
pypi = { url = "https://upload.pypi.org/legacy/" }

[tool.pytest.ini_options]
markers = [
  "integration: marks end-to-end or external integration tests",
  "slow: marks tests that are expected to run slowly",
  "contract: marks property-based stage-boundary contract tests",
  "fuzz: marks property-based (Hypothesis) fuzz tests",
  "doctest_examples: runs doctest examples for targeted public modules"
]
python_files = [
  "test_*.py",
  "*_test.py",
]
testpaths = [
  "tests",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
  "examples/notebooks",
  "openmed/service/proto/generated",
]

[tool.ruff.lint]
select = [
  "E9",
  "F63",
  "F7",
  "F82",
  "I",
]
fixable = ["I"]
unfixable = [
  "E9",
  "F63",
  "F7",
  "F82",
]

[tool.ruff.lint.isort]
known-first-party = ["openmed"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Scoped type-checking configuration. This intentionally covers only the newer
# v1.6 public surfaces that already ship precise annotations and a py.typed
# marker; it is not a strict project-wide gate. The pinned development checker,
# local Make target, regression test, and CI lint job all use this same scope.
[tool.mypy]
python_version = "3.10"
files = [
  "openmed/core/audit.py",
  "openmed/core/pipeline.py",
  "openmed/clinical/context.py",
  "openmed/clinical/exporters/fhir/bundle.py",
]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
