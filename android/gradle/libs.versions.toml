[versions]
agp = "7.4.2"
kotlin = "1.8.22"
kotlinx-coroutines = "1.8.1"
kotlinx-serialization-json = "1.5.1"
mlkit-text-recognition = "16.0.1"
onnxruntime = "1.25.1"
djl-tokenizers = "0.33.0"
icu4j = "78.3"
junit = "4.13.2"
robolectric = "4.11.1"
slf4j-android-compatible = "1.7.30"
errorprone-android-compatible = "2.11.0"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-text-recognition" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
djl-tokenizers = { module = "ai.djl.huggingface:tokenizers", version.ref = "djl-tokenizers" }
djl-tokenizer-native-android = { module = "ai.djl.android:tokenizer-native", version.ref = "djl-tokenizers" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
slf4j-android-compatible = { module = "org.slf4j:slf4j-api", version.ref = "slf4j-android-compatible" }
errorprone-android-compatible = { module = "com.google.errorprone:error_prone_annotations", version.ref = "errorprone-android-compatible" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
