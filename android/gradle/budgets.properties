# Release AAR ceiling (512 KiB). Current-master baseline: 444472 bytes.
# Increase only after reviewing the packaged artifact and dependency footprint.
aar.maxBytes=524288

# Catalog load plus downloader/cache construction in a Robolectric JVM worker.
# The timer excludes Robolectric startup and performs no network access.
coldStart.maxMillis=500

# Per-ABI install size OpenMedKit adds to an R8-minified host app: the release
# split APK of :consumer-r8-smoke with OpenMedKit minus the same app without it.
# Native libraries are stored uncompressed, so APK bytes are what the device
# keeps installed. Whole-MiB ceilings, each at least 512 KiB above the measured
# delta (arm64-v8a 48905000, armeabi-v7a 33670544, x86 56276132, x86_64
# 56511916 bytes). Packaging the desktop JNI resources that the recommended
# excludes drop would add about 9.6 MB per ABI and fail every ceiling.
consumerApk.arm64-v8a.maxDeltaBytes=50331648
consumerApk.armeabi-v7a.maxDeltaBytes=34603008
consumerApk.x86.maxDeltaBytes=57671680
consumerApk.x86_64.maxDeltaBytes=57671680
