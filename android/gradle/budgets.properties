# Release AAR ceiling (608 KiB). Baseline with format-aware artifact acquisition:
# 581647 bytes (496463 before it); the growth is first-party bytecode only, with
# no new runtime dependency.
# Increase only after reviewing the packaged artifact and dependency footprint.
aar.maxBytes=622592

# Catalog load plus downloader/cache construction in a Robolectric JVM worker.
# The timer excludes Robolectric startup and performs no network access.
coldStart.maxMillis=500
