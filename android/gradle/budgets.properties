# Release AAR ceiling (3352 KiB) for the combined v4.1 surface, about 66 KiB
# above the measured AAR as for v4.0. The v4.0 surface measured 3110921 bytes
# (3104 KiB ceiling); v4.1 adds the kit parity surfaces: generated contract
# types (about 95 KiB), the PII, clinical-entity, assertion and medication task
# packs (about 48 KiB), multimodal evidence and streaming speech contracts
# (about 56 KiB), and the receipt verifier, portable SDK configuration,
# download lifecycle events, coded errors, date shifting and identifier
# validators. The release AAR measures 3365126 bytes. It still bundles no Maven
# dependencies; it packages the NDK r28c libc++_shared.so that
# libdjl_tokenizer.so links against, stripped, for four ABIs (arm64-v8a
# 1253544, armeabi-v7a 850380, x86 1143240, x86_64 1229808 bytes; 1574349 bytes
# compressed). The consumer R8 gate budgets installed size. Increase only after
# reviewing the packaged artifact and dependency footprint.
aar.maxBytes=3432448

# Catalog load plus downloader/cache construction in a Robolectric JVM worker.
# The timer excludes Robolectric startup and performs no network access.
coldStart.maxMillis=500

# Per-ABI install size OpenMedKit adds to an R8-minified host app: the release
# split APK of :consumer-r8-smoke with OpenMedKit minus the same app without it.
# Native libraries are stored uncompressed, so APK bytes are what the device
# keeps installed. Whole-MiB ceilings, each at least 512 KiB above the measured
# delta (arm64-v8a 37077102, armeabi-v7a 25725654, x86 43842026, x86_64
# 44110578 bytes), which includes the packaged libc++_shared.so (850380 to
# 1253544 bytes per ABI). Packaging the desktop JNI resources that the
# recommended excludes drop would add about 9.6 MB per ABI and fail every
# ceiling.
consumerApk.arm64-v8a.maxDeltaBytes=37748736
consumerApk.armeabi-v7a.maxDeltaBytes=27262976
consumerApk.x86.maxDeltaBytes=45088768
consumerApk.x86_64.maxDeltaBytes=45088768
