# Release AAR ceiling (576 KiB), including the experimental multimodal contracts.
# A baseline release build measured 496463 bytes. Hosted CI measured 565571 bytes
# with the mirror. Its Kotlin classes reuse the existing serialization library.
# Increase only after reviewing the packaged artifact and dependency footprint.
aar.maxBytes=589824

# Catalog load plus downloader/cache construction in a Robolectric JVM worker.
# The timer excludes Robolectric startup and performs no network access.
coldStart.maxMillis=500
