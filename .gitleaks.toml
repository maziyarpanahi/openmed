title = "OpenMed secret scanning"

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Literal synthetic unresolved patient identifier in clinical registry test"
condition = "AND"
regexTarget = "line"
paths = ['''^tests/unit/structured/registry/test_(clinical_)?registry\.py$''']
regexes = ['''^\s*patient_key="patient_unresolved000001",\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Literal synthetic unresolved patient identifier in dataset integration fixture"
condition = "AND"
regexTarget = "line"
paths = ['''^tests/integration/test_saved_cohort_dataset_build\.py$''']
regexes = ['''^\s*patient_key="patient_unresolved000001",\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Literal synthetic patient identifier in saved cohort journey fixture"
condition = "AND"
regexTarget = "line"
paths = ['''^tests/integration/test_saved_cohort_journey\.py$''']
regexes = ['''^\s*patient_key="patient_goldenjourney001",\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Literal synthetic patient identifier in identity resolution examples"
condition = "AND"
regexTarget = "line"
paths = ['''^docs/interop/identity-resolution\.md$''']
regexes = ['''^\s*(selected_)?canonical_key="patient_0123456789abcdef",\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic sentinels in the security profile redaction test"
condition = "AND"
regexTarget = "line"
paths = ['''tests/unit/service/test_security_profile\.py$''']
regexes = ['''^\s*"(secret|db_password)": "(jwk-secret-sentinel-d54|dbpass-sentinel-j90)",\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic sentinels in the deployment posture test"
condition = "AND"
regexTarget = "line"
paths = ['''tests/unit/deploy/test_deploy_posture\.py$''']
regexes = ['''^\s*"(key|api_key)": "sentinel-(secret|api)-key-4471",\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic sentinel key in the diagnostic state fixture"
condition = "AND"
regexTarget = "line"
paths = ['''tests/fixtures/diagnostic_state\.py$''']
regexes = ['''^\s*SENTINEL_KEY = "sk-live-SENTINEL-KEY-9000"\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic query sentinel in the egress policy test"
condition = "AND"
regexTarget = "line"
paths = ['''tests/unit/service/test_egress_policy\.py$''']
regexes = ['''^\s*SENTINEL_QUERY = "token=synthetic-secret-91f2"\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic bundle key in the portable bundle cache and managed import vectors"
condition = "AND"
regexTarget = "line"
paths = ['''tests/fixtures/(bundle_cache|managed_import)/vectors\.json$''']
regexes = ['''^\s*"bundle_key": "b-0892313f735f0f3038b881cade3a0677",?\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Byte-sequence test key in the portable policy parity vectors"
condition = "AND"
regexTarget = "line"
paths = ['''tests/fixtures/parity/portable_policy_vectors\.json$''']
regexes = ['''^\s*"synthetic_test_key_long": "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f202122232425262728292a2b2c2d2e2f303132333435363738393a3b3c3d3e3f40",?\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Documented example Idempotency-Key UUID for bulk starts"
condition = "AND"
regexTarget = "line"
paths = ['''(docs/interop/fhir-bulk-data\.md|openmed/service/idempotency\.py|tests/unit/service/test_start_idempotency\.py)$''']
regexes = ['''^\s*(-H "Idempotency-Key: 8e03978e-40d5-43e8-bc93-6894a57f9324" \\|``Idempotency-Key: "8e03978e-40d5-43e8-bc93-6894a57f9324"``\.|uuid_key = "8e03978e-40d5-43e8-bc93-6894a57f9324")\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Credential watcher argument names, not credential values"
condition = "AND"
regexTarget = "line"
paths = ['''openmed/service/mtls\.py$''']
regexes = ['''^\s*self\.credentials, interval_seconds=interval\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Ledger key variable name in the webhook replay test, not a key value"
condition = "AND"
regexTarget = "line"
paths = ['''tests/unit/service/test_webhook_replay\.py$''']
regexes = ['''^\s*tmp_path / "l\.json", integrity_key=LEDGER_KEY, delivery_ttl_seconds=(0|60)\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic idempotency key and its call sites in the job recovery unit test"
condition = "AND"
regexTarget = "line"
paths = ['''tests/unit/service/test_job_recovery\.py$''']
regexes = ['''^\s*(KEY = "6c1f0a2e-8f3b-4d7e-9a10-5b2c3d4e5f60"|_request\((method="remove"|webhook=hooked)\), KEY, owner_digest=None)\s*$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic idempotency keys in the job recovery integration test"
condition = "AND"
regexTarget = "line"
paths = ['''tests/integration/test_service_job_recovery\.py$''']
regexes = ['''^\s*((key|shift_key) = "(0f3c1a52-5d4e-4c4f-9a65-2d4b8b8f6e10|7d2b6f0e-93a1-4e58-b4d3-0c6a9e1f2a77)"|scoped = queue\.submit_job\(_request\(\), idempotency_key=key, idempotency_scope="b"\))\s*$''']

[extend]
useDefault = true

[[rules]]
id = "local-credential-file"
description = "Local credential files must not be committed"
path = '''(^|/)(creds\.txt|\.pypirc|secrets\.json|\.env(\..*)?)$'''
regex = '''(?m).+'''
tags = ["credentials", "local-secret-file"]

[[rules]]
id = "openmed-secret-scan-canary"
description = "Synthetic canary used to verify the secret scanner gate"
regex = '''OPENMED_SECRET_SCAN_CANARY_[A-Z0-9]{32}'''
keywords = ["OPENMED_SECRET_SCAN_CANARY_"]
tags = ["secret-scanner-canary"]

[[allowlists]]
targetRules = ["openmed-secret-scan-canary"]
description = "Committed canary fixture; CI copies it to a non-allowlisted path to prove detection still works"
paths = ['''tests/fixtures/secret_scan_canary\.txt$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic secret labels in the privacy filter example"
condition = "AND"
regexTarget = "line"
paths = ['''examples/privacy_filter_book/app\.py$''']
regexes = ['''\("secret", "(VIOLET-WINDSOR-1944|KRONEN-29-ALPHA|silver-maple-lune-88)"\)''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic patient key in the determinism regression fixture"
condition = "AND"
regexTarget = "line"
paths = ['''openmed/eval/determinism\.py$''']
regexes = ['''patient_key="synthetic-patient-0001"''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Swift demo note describes tokenization, not a token value"
condition = "AND"
regexTarget = "line"
paths = ['''swift/OpenMedDemo/OpenMedDemo/ContentView\.swift$''']
regexes = ['''o200k_base tokenization, BIOES/Viterbi decoding''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Cloudflare Web Analytics beacon token is public site metadata"
condition = "AND"
regexTarget = "line"
paths = ['''docs/website/index\.html$''']
regexes = ['''data-cf-beacon=.*"token": "[0-9a-f]{32}"''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic dataset marker in the guard regression fixture"
condition = "AND"
regexTarget = "line"
paths = ['''tests/unit/guard/test_dataset\.py$''']
regexes = ['''SYNTHETIC_(TOKEN|MARKER) = "SYNTHETIC_SUBJECT_001"''']

[[allowlists]]
targetRules = ["aws-access-token"]
description = "Synthetic AWS-shaped credential in the privacy scanner unit test"
condition = "AND"
regexTarget = "line"
paths = ['''tests/unit/test_privacy_scan_action\.py$''']
regexes = ['''key: AKIA(?:ABCDEFGHIJKLMNOP)''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Exact public Cloudflare site identifier used by analytics regression tests"
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/browser/brand/brand\.spec\.ts$''', '''^tests/unit/test_brand_system\.py$''']
regexes = ['''^86108e13d57f44f69a4c67a445df1f17$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Exact public openai/whisper-tiny.en tokenizer Git revision used by the Core ML speech adapter"
condition = "AND"
regexTarget = "secret"
paths = ['''^swift/OpenMedKit/Sources/OpenMedSpeech/VerifiedSpeechArtifact\.swift$''']
regexes = ['''^87c7102498dcde7456f24cfd30239ca606ed9063$''']
