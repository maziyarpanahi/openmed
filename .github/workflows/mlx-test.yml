name: MLX Unit Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'openmed/mlx/**'
      - 'openmed/core/backends.py'
      - 'tests/unit/mlx/**'
      - 'tests/unit/test_backends.py'
  pull_request:
    branches: [main, master]
    paths:
      - 'openmed/mlx/**'
      - 'openmed/core/backends.py'
      - 'tests/unit/mlx/**'
      - 'tests/unit/test_backends.py'

jobs:
  mlx-unit-tests:
    name: MLX unit tests (no hardware)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install dependencies
      run: |
        uv sync --frozen --extra dev --python ${{ matrix.python-version }}

    - name: Run MLX unit tests (mocked, no MLX required)
      run: |
        uv run pytest tests/unit/mlx/ tests/unit/test_backends.py -v
