name: Secret Scan

on:
  push:
    branches: [ main, master, develop, 'release/v*' ]
  pull_request:
    branches: [ main, master, develop, 'release/v*' ]
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  commit-attribution:
    # PRs cannot replace their own validator. Only trusted base-branch code runs.
    # Pushes bootstrap the gate when this workflow first lands on a release branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    env:
      POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      POLICY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
    - name: Mark attribution check pending
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$POLICY_HEAD" \
          -f state=pending -f context='Commit attribution policy' \
          -f description='Checking all incoming commit identities and messages' \
          -f target_url="$POLICY_URL" > /dev/null

    - name: Check out trusted validator
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.event.pull_request.base.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Check complete incoming history
      id: attribution
      env:
        EVENT_NAME: ${{ github.event_name }}
        POLICY_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        if [ "$EVENT_NAME" = 'pull_request_target' ]; then
          # Fetch commit objects as data only. Never check out or execute PR code.
          git fetch --no-tags origin "$POLICY_HEAD"
        elif [ "$GITHUB_REF" = 'refs/heads/master' ] || \
             [ "$GITHUB_REF" = 'refs/heads/main' ]; then
          POLICY_BASE="$PUSH_BEFORE"
        else
          POLICY_BASE='origin/master'
        fi
        python scripts/release/check_repo_policy.py --commits "$POLICY_BASE" "$POLICY_HEAD"

    - name: Publish attribution result on the exact PR head
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        POLICY_OUTCOME: ${{ steps.attribution.outcome }}
      run: |
        state=failure
        if [ "$POLICY_OUTCOME" = 'success' ]; then state=success; fi
        gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$POLICY_HEAD" \
          -f state="$state" -f context='Commit attribution policy' \
          -f description='Full incoming history: authors, committers and attribution footers' \
          -f target_url="$POLICY_URL" > /dev/null

  secret-scan:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Install gitleaks
      run: |
        archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -sSfL \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -o "$archive"
        echo "${GITLEAKS_LINUX_X64_SHA256}  $archive" | sha256sum -c -
        tar -xzf "$archive" -C /tmp gitleaks
        sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Verify secret scanner canary
      run: |
        canary_dir="$(mktemp -d)"
        cp tests/fixtures/secret_scan_canary.txt "$canary_dir/canary.txt"
        set +e
        gitleaks dir \
          --config .gitleaks.toml \
          --redact \
          --no-banner \
          --report-format json \
          --report-path "$RUNNER_TEMP/gitleaks-canary.json" \
          "$canary_dir"
        canary_status=$?
        set -e
        if [ "$canary_status" -eq 0 ]; then
          echo "::error title=Secret scanner canary was not detected::Expected the synthetic canary to fail outside its allowlisted fixture path"
          exit 1
        fi
        if [ "$canary_status" -ne 1 ]; then
          echo "::error title=Secret scanner canary failed unexpectedly::Scanner exited with status $canary_status"
          exit "$canary_status"
        fi

    - name: Scan committed changes for secrets
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        zero_sha="0000000000000000000000000000000000000000"
        if [ "$EVENT_NAME" = "pull_request" ]; then
          scan_range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
        elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "$zero_sha" ]; then
          scan_range="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
        else
          scan_range="${GITHUB_SHA}^..${GITHUB_SHA}"
        fi
        gitleaks git \
          --config .gitleaks.toml \
          --baseline-path .secrets.baseline \
          --redact \
          --no-banner \
          --verbose \
          --log-opts "$scan_range" \
          .
