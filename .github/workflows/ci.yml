name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  repo-policy:
    runs-on: ubuntu-latest
    outputs:
      run-i18n-cjk-indic: ${{ steps.i18n_changes.outputs.should_run }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Detect CJK and Indic test changes
      id: i18n_changes
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [[ "$EVENT_NAME" != "pull_request" ]]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        elif git diff --quiet "$BASE_SHA" HEAD -- \
          openmed/core/pii_i18n.py \
          openmed/core/script_detect.py \
          openmed/core/decoding \
          openmed/interop/zh.py \
          openmed/interop/indic.py \
          openmed/processing/zh_pinyin.py \
          tests/unit/core/test_script_detect.py \
          tests/unit/core/test_chinese_pinyin_surrogates.py \
          tests/unit/test_pii_i18n.py \
          tests/unit/interop/test_language_adapters.py \
          tests/unit/interop/test_i18n_cjk_indic_fixtures.py \
          tests/unit/processing/test_zh_pinyin.py \
          tests/fixtures/i18n; then
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "No CJK or Indic test paths changed."
        else
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Enforce repo file policy
      run: |
        python scripts/release/check_repo_policy.py

    - name: Enforce dependency license policy
      run: |
        python scripts/release/check_license_policy.py

    - name: Assert built wheel contains no restricted vocabulary data
      run: |
        uv build --wheel --out-dir "$RUNNER_TEMP/openmed-wheel"
        python scripts/release/check_license_policy.py \
          --wheel "$RUNNER_TEMP"/openmed-wheel/*.whl

    - name: Validate GitHub Actions references
      run: |
        uv run --no-project --with pyyaml==6.0.3 python scripts/release/check_github_actions_refs.py --require-sha
        uv run --no-project --with pyyaml==6.0.3 python scripts/release/check_github_actions_refs.py --require-sha \
          --workflows-dir .github/actions

  readme-i18n-drift:
    needs: repo-policy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11"

    - name: Detect README changes
      id: readme_changes
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [[ "$EVENT_NAME" != "pull_request" ]]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        elif git diff --quiet "$BASE_SHA" HEAD -- 'README*'; then
          echo "should_run=false" >> "$GITHUB_OUTPUT"
          echo "No README files changed; translation drift check is not needed."
        else
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Check README translation drift
      if: steps.readme_changes.outputs.should_run == 'true'
      run: |
        if ! python scripts/i18n/check_readme_drift.py; then
          echo "::error title=README translation drift::One or more README translations are stale. Review them using docs/i18n/glossary.md, then refresh the committed section manifest."
          exit 1
        fi

  grounding-export-validation:
    needs: repo-policy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install validation dependencies
      run: |
        uv sync --frozen --extra dev --extra grounding-validate --python 3.11

    - name: Fetch pinned HL7 FHIR validator
      run: |
        curl --fail --location --retry 3 \
          https://github.com/hapifhir/org.hl7.fhir.core/releases/download/6.8.1/validator_cli.jar \
          --output "$RUNNER_TEMP/validator_cli.jar"
        echo "7d05b31196557a8ed2748d3c8a1646deba9b6600f5b6946be598949bd11eefe2  $RUNNER_TEMP/validator_cli.jar" \
          | sha256sum --check --strict

    - name: Validate synthetic FHIR and OMOP grounding exports
      run: |
        uv run python -m openmed.eval.suites.grounding_export \
          --validator-jar "$RUNNER_TEMP/validator_cli.jar" \
          --output grounding-export-validation.json \
          --markdown-output grounding-export-validation.md

    - name: Upload grounding export validation report
      if: always() && hashFiles('grounding-export-validation.json') != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: grounding-export-validation
        path: |
          grounding-export-validation.json
          grounding-export-validation.md

  lockfile-drift:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Check uv.lock matches pyproject.toml
      run: |
        if ! uv lock --check; then
          echo "::error title=uv.lock is out of date::Run 'uv lock' and commit the updated uv.lock."
          exit 1
        fi

  lint:
    needs: repo-policy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install lint dependencies
      run: |
        uv sync --frozen --extra dev --python 3.11

    - name: Lint with Ruff
      run: |
        uv run ruff check --output-format=github .

    - name: Check Ruff formatting
      run: |
        uv run ruff format --check .

    - name: Enforce public API backwards-compatibility policy
      run: |
        uv run python scripts/release/check_public_api.py

    - name: Type-check annotated public modules
      run: |
        uv run mypy

  test:
    needs: [repo-policy, lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          # Exclude some combinations to reduce CI time
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.10"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install dependencies
      run: |
        uv sync --frozen --extra dev --python ${{ matrix.python-version }}

    - name: Validate model manifest schema
      run: |
        uv run python -m scripts.manifest.validate_manifest

    - name: Trust-CI no-raw-PHI logging guard
      run: |
        uv run pytest tests/unit/test_no_raw_text_logging.py -q

    - name: Test with pytest
      timeout-minutes: 45
      run: >-
        uv run --frozen python -c
        "import faulthandler, pytest; diagnostics = type('CiSummaryDiagnostics', (), {'pytest_sessionfinish': lambda self, session, exitstatus: faulthandler.dump_traceback_later(120, repeat=True)})(); raise SystemExit(pytest.main(plugins=[diagnostics]))"
        --cov=openmed --cov-report=xml --cov-report=term-missing
        --tb=line --show-capture=no --color=no --code-highlight=no -ra
        --junitxml=pytest-results.xml

    - name: Upload test diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.run_attempt }}
        path: |
          pytest-results.xml
          coverage.xml
        if-no-files-found: warn

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  sdk-compatibility:
    # Bounded core contracts and installed artifacts on every advertised lane.
    # Model/runtime qualification remains separate; no weights are downloaded.
    needs: repo-policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      OPENMED_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Prepare frozen test and package dependencies
      shell: bash
      run: |
        uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
        uv export --frozen --no-hashes --no-emit-project --extra cli --extra service --extra mcp --output-file "$RUNNER_TEMP/compat-constraints.txt"
    - name: Core privacy and platform contracts
      run: >-
        uv run --frozen pytest -q --timeout=120 --timeout-method=thread
        tests/unit/install/test_smoke_check.py
        tests/unit/release/test_release_budget_workflow.py
        tests/unit/service/test_brief_surfaces.py
        tests/unit/ner/test_infer.py
        tests/unit/test_no_raw_text_logging.py
    - name: Build wheel and source distribution
      shell: bash
      run: uv build --out-dir "$RUNNER_TEMP/compat-dist"
    - name: Verify clean core and adapter installs plus missing-resource controls
      shell: bash
      run: >-
        python scripts/install/smoke_check.py
        --artifacts "$RUNNER_TEMP/compat-dist"
        --constraints "$RUNNER_TEMP/compat-constraints.txt"
        --report sdk-compatibility.json
    - name: Upload value-free compatibility evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: sdk-compatibility-${{ matrix.os }}-${{ matrix.python-version }}
        path: sdk-compatibility.json
        if-no-files-found: warn

  sdk-compatibility-gate:
    # Stable required-check name; a missing/cancelled matrix is not success.
    needs: sdk-compatibility
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Require every advertised combination
      env:
        MATRIX_RESULT: ${{ needs.sdk-compatibility.result }}
      run: test "$MATRIX_RESULT" = success

  security:
    needs: repo-policy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install dependencies
      run: |
        uv sync --frozen --extra dev --python 3.11

    - name: Run Bandit report
      run: |
        uv run --with 'bandit[toml]' bandit -r openmed -f json -o bandit-report.json --exit-zero

    - name: Enforce high-severity Bandit findings
      run: |
        uv run --with 'bandit[toml]' bandit -r openmed --severity-level high --confidence-level medium

    - name: Run pip-audit dependency gate
      run: |
        uv run \
          --with pip-audit \
          --with 'requests>=2.33.0' \
          --with 'urllib3>=2.7.0' \
          python scripts/security/pip_audit_gate.py

    - name: Upload security reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: security-reports
        path: |
          bandit-report.json
          pip-audit-report.json
      if: always()

  sbom:
    needs: repo-policy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Sync runtime environment
      run: |
        uv sync --frozen --python 3.11

    - name: Generate CycloneDX SBOM
      run: |
        uv run --no-project --with 'cyclonedx-bom>=4.6,<7' python scripts/security/generate_sbom.py

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: sbom
        path: sbom.cdx.json
      if: always()

  spacy-integration:
    needs: [repo-policy, lint]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install spaCy test dependencies
      run: |
        uv sync --frozen --extra dev --extra spacy --python 3.11

    - name: Run spaCy adapter tests
      run: |
        uv run pytest tests/unit/interop/test_spacy_component.py -q

  browser-extension:
    needs: repo-policy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: web/extension/package-lock.json

    - name: Install extension dependencies
      working-directory: web/extension
      run: npm ci

    - name: Install headless Chromium
      working-directory: web/extension
      run: npx playwright install --with-deps chromium

    - name: Test browser extension
      working-directory: web/extension
      run: npm test

  yasbd-integration:
    needs: [repo-policy, lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install YASBD integration dependencies
      run: |
        uv sync --frozen --extra dev --extra yasbd --python ${{ matrix.python-version }}

    - name: Test the real YASBD adapter and sentence API
      run: |
        uv run pytest tests/unit/processing/test_sentences.py tests/unit/test_core.py \
          -q -k "yasbd or sentence"

  i18n-cjk-indic:
    needs: [repo-policy, lint]
    if: needs.repo-policy.outputs.run-i18n-cjk-indic == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install CJK and Indic test dependencies
      run: |
        uv sync --frozen --extra dev --extra zh --extra indic --python 3.11

    - name: Run CJK and Indic fixture tests
      run: |
        uv run pytest tests/unit -q -k "i18n or script_detect or cjk or indic or pinyin"

    - name: Trust-CI no-raw-PHI logging guard
      run: |
        uv run pytest tests/unit/test_no_raw_text_logging.py -q

  build:
    needs:
    - repo-policy
    - lint
    - test
    - security
    - spacy-integration
    - yasbd-integration
    - i18n-cjk-indic
    - browser-extension
    - sdk-compatibility-gate
    if: >-
      always() &&
      needs.repo-policy.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.security.result == 'success' &&
      needs.spacy-integration.result == 'success' &&
      needs.yasbd-integration.result == 'success' &&
      needs.browser-extension.result == 'success' &&
      needs.sdk-compatibility-gate.result == 'success' &&
      (
        needs.i18n-cjk-indic.result == 'success' ||
        needs.i18n-cjk-indic.result == 'skipped'
      )
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        version: "0.11.28"
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Build package
      run: |
        uv build

    - name: Enforce wheel size budget and record language-extra footprints
      run: |
        python scripts/release/check_size_budget.py \
          --skip-build \
          --wheel-dir dist \
          --report size-budget-report.json

    - name: Install built core wheel for import budget
      run: |
        uv pip install --system dist/*.whl

    - name: Enforce core import budget
      run: |
        python scripts/release/check_import_budget.py

    - name: Verify PEP 561 marker in built artifacts
      run: |
        python - <<'PY'
        from pathlib import Path
        import tarfile
        import zipfile

        wheel = next(Path("dist").glob("*.whl"))
        sdist = next(Path("dist").glob("*.tar.gz"))
        with zipfile.ZipFile(wheel) as archive:
            assert "openmed/py.typed" in archive.namelist()
        with tarfile.open(sdist, "r:gz") as archive:
            assert any(name.endswith("/openmed/py.typed") for name in archive.getnames())
        PY

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: dist-packages
        path: |
          dist/
          size-budget-report.json
      if: always()
