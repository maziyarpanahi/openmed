name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
    paths:
      - ".github/workflows/pages.yml"
      - "Makefile"
      - "README*.md"
      - "docs/**"
      - "mkdocs.yml"
      - "models.jsonl"
      - "openmed/**"
      - "pyproject.toml"
      - "scripts/brand/**"
      - "scripts/docs/**"
      - "scripts/i18n/**"
      - "scripts/status/**"
      - "js/openmedkit-web/**"
      - "tests/browser/brand/**"
      - "tests/browser/privacy-playground.spec.ts"
      - "tests/web/**"
      - "tests/unit/test_brand_system.py"
      - "tests/unit/test_docs_publication.py"
      - "tests/unit/test_pages_manifest.py"
      - "tests/unit/test_readme_i18n_drift.py"
      - "tests/unit/test_readme_sw_drift.py"
      - "tests/unit/test_web_demo_layout.py"
      - "tests/unit/eval/test_leaderboard.py"
      - "tests/unit/eval/test_nightly_status_refresh.py"
      - "uv.lock"
      - "web/runtime/**"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}"
  # Pages deployments should finish once started; cancelling them can leave
  # the final deploy-pages handoff in a failed state during merge bursts.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Install locked documentation tooling
        run: uv sync --frozen --extra dev --extra docs --python 3.11
      - name: Validate brand sources, claims, and generated art
        run: |
          uv run --frozen python scripts/brand/validate_system.py
          uv run --frozen python scripts/brand/update_claims.py --check
          uv run --frozen python scripts/brand/sync_consumers.py --check
          uv run --frozen python scripts/brand/render_social_assets.py --check
          uv run --frozen python -m pytest tests/unit/test_brand_system.py -q
      - name: Validate documentation publication contract
        run: |
          uv run --frozen python -m pytest \
            tests/unit/test_docs_publication.py \
            tests/unit/test_pages_manifest.py \
            -q
      - name: Validate documentation consumers
        run: |
          uv run --frozen python -m pytest \
            tests/unit/test_readme_i18n_drift.py \
            tests/unit/test_readme_sw_drift.py \
            tests/unit/test_web_demo_layout.py \
            tests/unit/eval/test_leaderboard.py \
            -q
      - name: Run nightly offline suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run --frozen python -m pytest tests/ -q
      - name: Refresh public trust status
        if: github.event_name != 'pull_request'
        run: |
          uv run --frozen python scripts/status/generate_nightly_control.py \
            --source-revision "$GITHUB_SHA" \
            --output docs/status/evidence/nightly-control.json
          uv run --frozen python scripts/status/generate_status.py \
            --manifest models.jsonl \
            --baseline gates/baseline.json \
            --report docs/benchmarks/golden.report.json \
            --nightly-report docs/status/evidence/nightly-control.json \
            --benchmarks-dir docs/benchmarks \
            --leaderboard-dir docs/leaderboard \
            --output docs/status/index.md
      - name: Stage and verify the exact Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            uv run --frozen python scripts/docs/stage_pages.py --release-tag "$GITHUB_REF_NAME"
          else
            uv run --frozen python scripts/docs/stage_pages.py
          fi
      - name: Setup Node for browser validation
        if: github.event_name != 'schedule'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            js/openmedkit-web/package-lock.json
            tests/browser/brand/package-lock.json
      - name: Build and validate the browser runtime
        if: github.event_name != 'schedule'
        run: |
          npm ci --prefix js/openmedkit-web
          npm --prefix js/openmedkit-web test
      - name: Install pinned browser test dependencies
        if: github.event_name != 'schedule'
        run: npm ci --prefix tests/browser/brand
      - name: Validate browser behavior, accessibility, and representative visuals
        if: github.event_name != 'schedule'
        run: |
          docker run --rm --ipc=host \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env CI=true \
            mcr.microsoft.com/playwright:v1.62.0-noble@sha256:02bbb2155cd7109e3e9c741941097ed1608cf8b6fa44ee2595896da2bdc1f471 \
            /bin/bash -lc "npm --prefix tests/browser/brand test"
      - name: Upload browser validation evidence
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-browser-evidence
          path: output/playwright/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
