name: Android CI (OpenMedKit)

on:
  push:
    branches: [main, master, 'release/v*' ]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'android/**'
      - 'fixtures/parity/**'
      - 'scripts/parity/**'
      - 'scripts/android/check_apk_zip_alignment.py'
      - 'scripts/android/check_elf_page_alignment.py'
      - 'scripts/android/generate_emulator_lane_fixture.py'
      - 'scripts/android/run_emulator_lane.sh'
      - 'scripts/release/check_native_api_migration.py'
      - 'scripts/android/check_r8_consumer.py'
      - 'scripts/android/generate_r8_smoke_model.py'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/parity/multimodal_contracts_v1.json'
      - 'tests/fixtures/parity/kit_parity_vectors.json'
      - 'tests/fixtures/parity/portable_policy_vectors.json'
      - 'openmed/core/policies/**'
      - 'openmed/core/labels.py'
      - 'openmed/core/thresholds.json'
      - 'openmed/core/portable_policy.py'
      - 'tests/fixtures/parity/document_intake_v1.json'
      - 'tests/fixtures/parity/sdk_config_v1.json'
      - 'tests/fixtures/parity/tokenizer/**'
      - 'tests/fixtures/processing/zh_segmentation_gold.json'
      - 'tests/fixtures/portable_bundle/**'
      - 'tests/fixtures/device_capabilities/**'
      - 'tests/fixtures/bundle_cache/**'
      - 'tests/fixtures/managed_import/**'
      - 'tests/fixtures/portable_bundle_calibration/**'
  pull_request:
    branches: [main, master, 'release/v*' ]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'android/**'
      - 'fixtures/parity/**'
      - 'scripts/parity/**'
      - 'scripts/android/check_apk_zip_alignment.py'
      - 'scripts/android/check_elf_page_alignment.py'
      - 'scripts/android/generate_emulator_lane_fixture.py'
      - 'scripts/android/run_emulator_lane.sh'
      - 'scripts/release/check_native_api_migration.py'
      - 'scripts/android/check_r8_consumer.py'
      - 'scripts/android/generate_r8_smoke_model.py'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/parity/multimodal_contracts_v1.json'
      - 'tests/fixtures/parity/kit_parity_vectors.json'
      - 'tests/fixtures/parity/portable_policy_vectors.json'
      - 'openmed/core/policies/**'
      - 'openmed/core/labels.py'
      - 'openmed/core/thresholds.json'
      - 'openmed/core/portable_policy.py'
      - 'tests/fixtures/parity/document_intake_v1.json'
      - 'tests/fixtures/parity/sdk_config_v1.json'
      - 'tests/fixtures/parity/tokenizer/**'
      - 'tests/fixtures/processing/zh_segmentation_gold.json'
      - 'tests/fixtures/portable_bundle/**'
      - 'tests/fixtures/device_capabilities/**'
      - 'tests/fixtures/bundle_cache/**'
      - 'tests/fixtures/managed_import/**'
      - 'tests/fixtures/portable_bundle_calibration/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-migration-policy:
    name: Require migration notes for Kotlin API breaks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    # A pull_request checkout is the merge commit; HEAD^1 is the base tip.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 2

    - name: Compare Kotlin API baseline with docs/migration
      run: >-
        python3 scripts/release/check_native_api_migration.py
        --platform kotlin --base HEAD^1 --head HEAD

  build-and-test:
    name: Build & Test Android OpenMedKit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          android/*.gradle*
          android/gradle.properties
          android/gradle/libs.versions.toml
          android/gradle/verification-metadata.xml
          android/gradle/wrapper/gradle-wrapper.properties
          android/**/build.gradle*
          android/**/gradle.lockfile

    # :openmedkit packages the pinned NDK's libc++_shared.so and strips it
    # with that NDK; AGP never downloads it for this (android/README.md).
    - name: Install the pinned Android NDK
      shell: bash
      run: |
        ndk="$(sed -n 's/^android-ndk = "\([0-9.]*\)"$/\1/p' android/gradle/libs.versions.toml)"
        if [[ -z "$ndk" ]]; then
          echo "::error title=NDK pin missing::android-ndk is not pinned in libs.versions.toml."
          exit 1
        fi
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" < /dev/null
        test -f "$ANDROID_HOME/ndk/$ndk/source.properties"

    - name: Verify Gradle dependency locks
      working-directory: android
      run: ./gradlew verifyDependencyLocks --stacktrace

    - name: Verify an unlocked dependency change fails the build
      working-directory: android
      run: |
        # Negative control: add a dependency to the library's release classpath
        # without updating its lockfile. org.json is already checksum-verified as
        # a test dependency, so only the lock state can reject it.
        init="$RUNNER_TEMP/unlocked-dependency.init.gradle"
        log="$RUNNER_TEMP/unlocked-dependency.log"
        cat > "$init" <<'GRADLE'
        allprojects {
            if (path == ':openmedkit') {
                afterEvaluate {
                    dependencies.add('implementation', 'org.json:json:20240303')
                }
            }
        }
        GRADLE
        if ./gradlew :openmedkit:compileReleaseKotlin --init-script "$init" > "$log" 2>&1; then
          echo "::error title=Unlocked dependency accepted::The Android build resolved a dependency missing from gradle.lockfile."
          exit 1
        fi
        if ! grep -q "which is not part of the dependency lock state" "$log"; then
          tail -n 40 "$log"
          echo "::error title=Unexpected negative-control failure::The build failed for a reason other than the lock state."
          exit 1
        fi

    - name: Assemble OpenMedKit debug libraries
      working-directory: android
      run: ./gradlew :openmedkit:assembleDebug :openmedkit-mlkit:assembleDebug --stacktrace

    - name: Verify core dependency boundary
      working-directory: android
      run: >-
        ./gradlew :openmedkit:verifyDependencyBoundary
        :openmedkit-mlkit:verifyDependencyBoundary
        --stacktrace

    - name: Run optional ML Kit OCR module tests
      working-directory: android
      run: ./gradlew :openmedkit-mlkit:testDebugUnitTest --stacktrace

    # Fails on any difference from api/openmedkit.api; run `apiDump` to refresh.
    - name: Check OpenMedKit public API baseline
      working-directory: android
      run: ./gradlew :openmedkit:apiCheck --stacktrace

    - name: Run Android contract parity suites
      working-directory: android
      run: >-
        ./gradlew :openmedkit:testDebugUnitTest
        --tests '*OffsetContractParityTest'
        --tests '*IcuSegmentationFallbackTest'
        --tests '*MultimodalContractParityTest'
        --tests '*SpanEquivalenceTest'
        --tests '*KitParityVectorTest'
        --tests '*PortablePolicyVectorTest'
        --tests '*DocumentEvidenceParityTest'
        --tests '*TokenizerConformanceTest'
        --tests '*SdkConfigParityTest'
        --stacktrace

    - name: Verify Android library budgets
      working-directory: android
      run: ./gradlew :openmedkit:verifyAndroidBudgets --continue --stacktrace

    - name: Verify R8-minified OpenMedKit consumer
      working-directory: android
      # Builds :consumer-r8-smoke with R8 full mode against the release AAR,
      # runs the JNI/keep-rule gate and its missing-keep-rule negative control,
      # the per-ABI install-size budget and 16 KB zip alignment. The on-device
      # smoke run of these APKs belongs in the emulator lane.
      run: ./gradlew :consumer-r8-smoke:verifyR8Consumer --continue --stacktrace

    - name: Assemble demo APKs
      working-directory: android
      run: >-
        ./gradlew
        :OpenMedDemo:app:assembleDebug
        :OpenMedScanDemo:app:assembleDebug
        :OpenMedMapleDemo:app:assembleDebug
        --stacktrace

    - name: Verify 16 KB APK zip alignment
      working-directory: android
      run: ./gradlew verifyApkZipAlignment --stacktrace

    - name: Verify 16 KB ELF alignment of APK native libraries
      working-directory: android
      run: ./gradlew verifyApkElfAlignment --stacktrace

    - name: Cross-check APK alignment with SDK zipalign
      shell: bash
      run: |
        zipalign=""
        while IFS= read -r candidate; do
          usage="$("$candidate" 2>&1 || true)"
          if [[ "$usage" == *"-P <pagesize_kb>"* ]]; then
            zipalign="$candidate"
            break
          fi
        done < <(ls -d "$ANDROID_HOME"/build-tools/*/zipalign | sort -V -r)
        if [[ -z "$zipalign" ]]; then
          echo "::error title=zipalign unavailable::Android build-tools 35 or newer is required."
          exit 1
        fi

        shopt -s nullglob
        apks=(
          android/*/app/build/outputs/apk/debug/*.apk
          android/openmedkit/build/outputs/apk/androidTest/debug/*.apk
        )
        if [[ ${#apks[@]} -ne 4 ]]; then
          echo "::error title=Missing APKs::Expected 3 demo APKs and 1 OpenMedKit test APK."
          exit 1
        fi
        for apk in "${apks[@]}"; do
          "$zipalign" -c -P 16 4 "$apk"
          echo "zipalign -c -P 16 4 passed: ${apk#android/}"
        done

    - name: Publish Android budget summary
      if: always()
      shell: bash
      run: |
        read_property() {
          awk -F= -v key="$2" '$1 == key { print $2; exit }' "$1"
        }

        budgets="android/gradle/budgets.properties"
        aar_report="android/openmedkit/build/reports/budgets/release-aar-size.properties"
        cold_start_report="android/openmedkit/build/reports/budgets/testDebugUnitTest-cold-start.properties"
        aar_measured="not measured"
        aar_budget="$(read_property "$budgets" aar.maxBytes)"
        aar_status="NOT RUN"
        cold_start_measured="not measured"
        cold_start_budget="$(read_property "$budgets" coldStart.maxMillis)"
        cold_start_status="NOT RUN"

        if [[ -f "$aar_report" ]]; then
          aar_measured="$(read_property "$aar_report" measuredBytes)"
          aar_status="$(read_property "$aar_report" status)"
        fi
        if [[ -f "$cold_start_report" ]]; then
          cold_start_measured="$(read_property "$cold_start_report" measuredMillis)"
          cold_start_status="$(read_property "$cold_start_report" status)"
        fi

        {
          echo "### Android library budgets"
          echo
          echo "| Gate | Measured | Budget | Status |"
          echo "| --- | ---: | ---: | :---: |"
          echo "| Release AAR size | ${aar_measured} bytes | ${aar_budget} bytes | ${aar_status} |"
          echo "| Offline cold start | ${cold_start_measured} ms | ${cold_start_budget} ms | ${cold_start_status} |"
        } >> "$GITHUB_STEP_SUMMARY"

        consumer_reports="android/consumer-r8-smoke/build/reports/r8-consumer"
        size_report="$consumer_reports/consumer-apk-size.properties"
        {
          echo
          echo "### R8-minified consumer (consumer-r8-smoke)"
          echo
          echo "| Gate | Findings | Status |"
          echo "| --- | ---: | :---: |"
          for gate in openmedkitRelease missingKeepRuleRelease; do
            report="$consumer_reports/${gate}-r8-gate.properties"
            if [[ -f "$report" ]]; then
              echo "| ${gate} R8 gate | $(read_property "$report" findings) | $(read_property "$report" status) |"
            else
              echo "| ${gate} R8 gate | not measured | NOT RUN |"
            fi
          done
          echo
          echo "| ABI | OpenMedKit adds | Budget | APK | Status |"
          echo "| --- | ---: | ---: | ---: | :---: |"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            budget="$(read_property "$budgets" "consumerApk.${abi}.maxDeltaBytes")"
            if [[ -f "$size_report" ]]; then
              echo "| ${abi} | $(read_property "$size_report" "${abi}.deltaBytes") bytes | ${budget} bytes | $(read_property "$size_report" "${abi}.apkBytes") bytes | $(read_property "$size_report" "${abi}.status") |"
            else
              echo "| ${abi} | not measured | ${budget} bytes | not measured | NOT RUN |"
            fi
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload unit test report
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: android-unit-test-report
        path: |
          android/openmedkit/build/reports/tests/testDebugUnitTest/
          android/openmedkit/build/test-results/testDebugUnitTest/
          android/openmedkit/build/reports/budgets/
          android/consumer-r8-smoke/build/reports/
          android/consumer-r8-smoke/build/outputs/mapping/*/mapping.txt
          android/consumer-r8-smoke/build/outputs/mapping/*/usage.txt
        if-no-files-found: ignore

  emulator-lane:
    # Runs OpenMedKit's instrumented tests with the real ONNX Runtime Android
    # and DJL tokenizer native libraries on hosted, KVM-accelerated emulators.
    # Run locally with scripts/android/run_emulator_lane.sh (see
    # docs/android-integration.md#emulator-lane).
    name: Emulator lane (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # One x86_64 API level from the supported range (minSdk 26 to 35),
          # plus the negative control that strips the native libraries.
          - lane: x86_64-api35
            api-level: 35
            target: google_apis
            page-size-kb: 4
            lane-args: --negative-control
          # 16 KB page-size image. DJL tokenizer-native 0.33.0 ships
          # libdjl_tokenizer.so with 4 KB LOAD-segment alignment, which a
          # 16 KB kernel refuses to load. The lane requires that refusal to
          # reproduce and skips the tokenizer-dependent tests; once a 16 KB
          # aligned tokenizer build lands, the packaging test fails with
          # known_blocker_resolved and --known-unloadable must be removed.
          - lane: x86_64-api35-16kb
            api-level: 35
            target: google_apis_ps16k
            page-size-kb: 16
            lane-args: --known-unloadable djl_tokenizer

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          android/*.gradle*
          android/gradle.properties
          android/gradle/libs.versions.toml
          android/gradle/wrapper/gradle-wrapper.properties
          android/**/build.gradle*

    # :openmedkit packages the pinned NDK's libc++_shared.so and strips it
    # with that NDK; AGP never downloads it for this (android/README.md).
    - name: Install the pinned Android NDK
      shell: bash
      run: |
        ndk="$(sed -n 's/^android-ndk = "\([0-9.]*\)"$/\1/p' android/gradle/libs.versions.toml)"
        if [[ -z "$ndk" ]]; then
          echo "::error title=NDK pin missing::android-ndk is not pinned in libs.versions.toml."
          exit 1
        fi
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" < /dev/null
        test -f "$ANDROID_HOME/ndk/$ndk/source.properties"

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Build OpenMedKit instrumented test APK
      working-directory: android
      run: ./gradlew :openmedkit:assembleDebugAndroidTest --stacktrace

    - name: Run emulator lane
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      env:
        LANE: ${{ matrix.lane }}
        PAGE_SIZE_KB: ${{ matrix.page-size-kb }}
        LANE_ARGS: ${{ matrix.lane-args }}
      with:
        api-level: ${{ matrix.api-level }}
        target: ${{ matrix.target }}
        arch: x86_64
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
        script: scripts/android/run_emulator_lane.sh --lane "$LANE" --page-size-kb "$PAGE_SIZE_KB" $LANE_ARGS

    - name: Upload emulator lane reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: android-emulator-lane-${{ matrix.lane }}
        path: |
          android/openmedkit/build/reports/emulator-lane/
          android/openmedkit/build/reports/androidTests/connected/
          android/openmedkit/build/reports/dependency-boundary/
          android/openmedkit-mlkit/build/reports/dependency-boundary/
          android/openmedkit-mlkit/build/reports/tests/testDebugUnitTest/
          android/openmedkit-mlkit/build/test-results/testDebugUnitTest/
        if-no-files-found: ignore
