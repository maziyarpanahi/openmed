name: Android CI (OpenMedKit)

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'android/**'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/processing/zh_segmentation_gold.json'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'android/**'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/processing/zh_segmentation_gold.json'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Android OpenMedKit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '11'
        cache: gradle
        cache-dependency-path: |
          android/*.gradle*
          android/gradle.properties
          android/gradle/libs.versions.toml
          android/gradle/wrapper/gradle-wrapper.properties
          android/**/build.gradle*

    - name: Assemble OpenMedKit debug library
      working-directory: android
      run: ./gradlew :openmedkit:assembleDebug --stacktrace

    - name: Run Android offset-contract parity suite
      working-directory: android
      run: >-
        ./gradlew :openmedkit:testDebugUnitTest
        --tests '*OffsetContractParityTest'
        --tests '*IcuSegmentationFallbackTest'
        --stacktrace

    - name: Verify Android library budgets
      working-directory: android
      run: ./gradlew :openmedkit:verifyAndroidBudgets --continue --stacktrace

    - name: Publish Android budget summary
      if: always()
      shell: bash
      run: |
        read_property() {
          awk -F= -v key="$2" '$1 == key { print $2; exit }' "$1"
        }

        budgets="android/gradle/budgets.properties"
        aar_report="android/openmedkit/build/reports/budgets/release-aar-size.properties"
        cold_start_report="android/openmedkit/build/reports/budgets/testDebugUnitTest-cold-start.properties"
        aar_measured="not measured"
        aar_budget="$(read_property "$budgets" aar.maxBytes)"
        aar_status="NOT RUN"
        cold_start_measured="not measured"
        cold_start_budget="$(read_property "$budgets" coldStart.maxMillis)"
        cold_start_status="NOT RUN"

        if [[ -f "$aar_report" ]]; then
          aar_measured="$(read_property "$aar_report" measuredBytes)"
          aar_status="$(read_property "$aar_report" status)"
        fi
        if [[ -f "$cold_start_report" ]]; then
          cold_start_measured="$(read_property "$cold_start_report" measuredMillis)"
          cold_start_status="$(read_property "$cold_start_report" status)"
        fi

        {
          echo "### Android library budgets"
          echo
          echo "| Gate | Measured | Budget | Status |"
          echo "| --- | ---: | ---: | :---: |"
          echo "| Release AAR size | ${aar_measured} bytes | ${aar_budget} bytes | ${aar_status} |"
          echo "| Offline cold start | ${cold_start_measured} ms | ${cold_start_budget} ms | ${cold_start_status} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload unit test report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: android-unit-test-report
        path: |
          android/openmedkit/build/reports/tests/testDebugUnitTest/
          android/openmedkit/build/test-results/testDebugUnitTest/
          android/openmedkit/build/reports/budgets/
        if-no-files-found: ignore
