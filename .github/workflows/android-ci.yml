name: Android CI (OpenMedKit)

on:
  push:
    branches: [main, master, 'release/v*' ]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'android/**'
      - 'scripts/android/check_apk_zip_alignment.py'
      - 'scripts/android/generate_emulator_lane_fixture.py'
      - 'scripts/android/run_emulator_lane.sh'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/processing/zh_segmentation_gold.json'
  pull_request:
    branches: [main, master, 'release/v*' ]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'android/**'
      - 'scripts/android/check_apk_zip_alignment.py'
      - 'scripts/android/generate_emulator_lane_fixture.py'
      - 'scripts/android/run_emulator_lane.sh'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/processing/zh_segmentation_gold.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test Android OpenMedKit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          android/*.gradle*
          android/gradle.properties
          android/gradle/libs.versions.toml
          android/gradle/wrapper/gradle-wrapper.properties
          android/**/build.gradle*

    - name: Assemble OpenMedKit debug library
      working-directory: android
      run: ./gradlew :openmedkit:assembleDebug --stacktrace

    - name: Run Android offset-contract parity suite
      working-directory: android
      run: >-
        ./gradlew :openmedkit:testDebugUnitTest
        --tests '*OffsetContractParityTest'
        --tests '*IcuSegmentationFallbackTest'
        --stacktrace

    - name: Verify Android library budgets
      working-directory: android
      run: ./gradlew :openmedkit:verifyAndroidBudgets --continue --stacktrace

    - name: Assemble demo APKs
      working-directory: android
      run: >-
        ./gradlew
        :OpenMedDemo:app:assembleDebug
        :OpenMedScanDemo:app:assembleDebug
        :OpenMedMapleDemo:app:assembleDebug
        --stacktrace

    - name: Verify 16 KB APK zip alignment
      working-directory: android
      run: ./gradlew verifyApkZipAlignment --stacktrace

    - name: Cross-check APK alignment with SDK zipalign
      shell: bash
      run: |
        zipalign=""
        while IFS= read -r candidate; do
          usage="$("$candidate" 2>&1 || true)"
          if [[ "$usage" == *"-P <pagesize_kb>"* ]]; then
            zipalign="$candidate"
            break
          fi
        done < <(ls -d "$ANDROID_HOME"/build-tools/*/zipalign | sort -V -r)
        if [[ -z "$zipalign" ]]; then
          echo "::error title=zipalign unavailable::Android build-tools 35 or newer is required."
          exit 1
        fi

        shopt -s nullglob
        apks=(
          android/*/app/build/outputs/apk/debug/*.apk
          android/openmedkit/build/outputs/apk/androidTest/debug/*.apk
        )
        if [[ ${#apks[@]} -ne 4 ]]; then
          echo "::error title=Missing APKs::Expected 3 demo APKs and 1 OpenMedKit test APK."
          exit 1
        fi
        for apk in "${apks[@]}"; do
          "$zipalign" -c -P 16 4 "$apk"
          echo "zipalign -c -P 16 4 passed: ${apk#android/}"
        done

    - name: Publish Android budget summary
      if: always()
      shell: bash
      run: |
        read_property() {
          awk -F= -v key="$2" '$1 == key { print $2; exit }' "$1"
        }

        budgets="android/gradle/budgets.properties"
        aar_report="android/openmedkit/build/reports/budgets/release-aar-size.properties"
        cold_start_report="android/openmedkit/build/reports/budgets/testDebugUnitTest-cold-start.properties"
        aar_measured="not measured"
        aar_budget="$(read_property "$budgets" aar.maxBytes)"
        aar_status="NOT RUN"
        cold_start_measured="not measured"
        cold_start_budget="$(read_property "$budgets" coldStart.maxMillis)"
        cold_start_status="NOT RUN"

        if [[ -f "$aar_report" ]]; then
          aar_measured="$(read_property "$aar_report" measuredBytes)"
          aar_status="$(read_property "$aar_report" status)"
        fi
        if [[ -f "$cold_start_report" ]]; then
          cold_start_measured="$(read_property "$cold_start_report" measuredMillis)"
          cold_start_status="$(read_property "$cold_start_report" status)"
        fi

        {
          echo "### Android library budgets"
          echo
          echo "| Gate | Measured | Budget | Status |"
          echo "| --- | ---: | ---: | :---: |"
          echo "| Release AAR size | ${aar_measured} bytes | ${aar_budget} bytes | ${aar_status} |"
          echo "| Offline cold start | ${cold_start_measured} ms | ${cold_start_budget} ms | ${cold_start_status} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload unit test report
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: android-unit-test-report
        path: |
          android/openmedkit/build/reports/tests/testDebugUnitTest/
          android/openmedkit/build/test-results/testDebugUnitTest/
          android/openmedkit/build/reports/budgets/
        if-no-files-found: ignore

  emulator-lane:
    # Runs OpenMedKit's instrumented tests with the real ONNX Runtime Android
    # and DJL tokenizer native libraries on hosted, KVM-accelerated emulators.
    # Run locally with scripts/android/run_emulator_lane.sh (see
    # docs/android-integration.md#emulator-lane).
    name: Emulator lane (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # One x86_64 API level from the supported range (minSdk 26 to 35),
          # plus the negative control that strips the native libraries.
          - lane: x86_64-api35
            api-level: 35
            target: google_apis
            page-size-kb: 4
            lane-args: --negative-control
          # 16 KB page-size image. DJL tokenizer-native 0.33.0 ships
          # libdjl_tokenizer.so with 4 KB LOAD-segment alignment, which a
          # 16 KB kernel refuses to load. The lane requires that refusal to
          # reproduce and skips the tokenizer-dependent tests; once a 16 KB
          # aligned tokenizer build lands, the packaging test fails with
          # known_blocker_resolved and --known-unloadable must be removed.
          - lane: x86_64-api35-16kb
            api-level: 35
            target: google_apis_ps16k
            page-size-kb: 16
            lane-args: --known-unloadable djl_tokenizer

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          android/*.gradle*
          android/gradle.properties
          android/gradle/libs.versions.toml
          android/gradle/wrapper/gradle-wrapper.properties
          android/**/build.gradle*

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Build OpenMedKit instrumented test APK
      working-directory: android
      run: ./gradlew :openmedkit:assembleDebugAndroidTest --stacktrace

    - name: Run emulator lane
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      env:
        LANE: ${{ matrix.lane }}
        PAGE_SIZE_KB: ${{ matrix.page-size-kb }}
        LANE_ARGS: ${{ matrix.lane-args }}
      with:
        api-level: ${{ matrix.api-level }}
        target: ${{ matrix.target }}
        arch: x86_64
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
        script: scripts/android/run_emulator_lane.sh --lane "$LANE" --page-size-kb "$PAGE_SIZE_KB" $LANE_ARGS

    - name: Upload emulator lane reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: android-emulator-lane-${{ matrix.lane }}
        path: |
          android/openmedkit/build/reports/emulator-lane/
          android/openmedkit/build/reports/androidTests/connected/
        if-no-files-found: ignore
