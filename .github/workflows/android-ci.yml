name: Android CI (OpenMedKit)

on:
  push:
    branches: [main, master, 'release/v*' ]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'android/**'
      - 'scripts/android/check_apk_zip_alignment.py'
      - 'scripts/android/check_r8_consumer.py'
      - 'scripts/android/generate_r8_smoke_model.py'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/processing/zh_segmentation_gold.json'
  pull_request:
    branches: [main, master, 'release/v*' ]
    paths:
      - '.github/workflows/android-ci.yml'
      - 'android/**'
      - 'scripts/android/check_apk_zip_alignment.py'
      - 'scripts/android/check_r8_consumer.py'
      - 'scripts/android/generate_r8_smoke_model.py'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/processing/zh_segmentation_gold.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test Android OpenMedKit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          android/*.gradle*
          android/gradle.properties
          android/gradle/libs.versions.toml
          android/gradle/wrapper/gradle-wrapper.properties
          android/**/build.gradle*

    - name: Assemble OpenMedKit debug library
      working-directory: android
      run: ./gradlew :openmedkit:assembleDebug --stacktrace

    - name: Run Android offset-contract parity suite
      working-directory: android
      run: >-
        ./gradlew :openmedkit:testDebugUnitTest
        --tests '*OffsetContractParityTest'
        --tests '*IcuSegmentationFallbackTest'
        --stacktrace

    - name: Verify Android library budgets
      working-directory: android
      run: ./gradlew :openmedkit:verifyAndroidBudgets --continue --stacktrace

    - name: Verify R8-minified OpenMedKit consumer
      working-directory: android
      # Builds :consumer-r8-smoke with R8 full mode against the release AAR,
      # runs the JNI/keep-rule gate and its missing-keep-rule negative control,
      # the per-ABI install-size budget and 16 KB zip alignment. The on-device
      # smoke run of these APKs belongs in the emulator lane.
      run: ./gradlew :consumer-r8-smoke:verifyR8Consumer --continue --stacktrace

    - name: Assemble demo APKs
      working-directory: android
      run: >-
        ./gradlew
        :OpenMedDemo:app:assembleDebug
        :OpenMedScanDemo:app:assembleDebug
        :OpenMedMapleDemo:app:assembleDebug
        --stacktrace

    - name: Verify 16 KB APK zip alignment
      working-directory: android
      run: ./gradlew verifyApkZipAlignment --stacktrace

    - name: Cross-check APK alignment with SDK zipalign
      shell: bash
      run: |
        zipalign=""
        while IFS= read -r candidate; do
          usage="$("$candidate" 2>&1 || true)"
          if [[ "$usage" == *"-P <pagesize_kb>"* ]]; then
            zipalign="$candidate"
            break
          fi
        done < <(ls -d "$ANDROID_HOME"/build-tools/*/zipalign | sort -V -r)
        if [[ -z "$zipalign" ]]; then
          echo "::error title=zipalign unavailable::Android build-tools 35 or newer is required."
          exit 1
        fi

        shopt -s nullglob
        apks=(
          android/*/app/build/outputs/apk/debug/*.apk
          android/openmedkit/build/outputs/apk/androidTest/debug/*.apk
        )
        if [[ ${#apks[@]} -ne 4 ]]; then
          echo "::error title=Missing APKs::Expected 3 demo APKs and 1 OpenMedKit test APK."
          exit 1
        fi
        for apk in "${apks[@]}"; do
          "$zipalign" -c -P 16 4 "$apk"
          echo "zipalign -c -P 16 4 passed: ${apk#android/}"
        done

    - name: Publish Android budget summary
      if: always()
      shell: bash
      run: |
        read_property() {
          awk -F= -v key="$2" '$1 == key { print $2; exit }' "$1"
        }

        budgets="android/gradle/budgets.properties"
        aar_report="android/openmedkit/build/reports/budgets/release-aar-size.properties"
        cold_start_report="android/openmedkit/build/reports/budgets/testDebugUnitTest-cold-start.properties"
        aar_measured="not measured"
        aar_budget="$(read_property "$budgets" aar.maxBytes)"
        aar_status="NOT RUN"
        cold_start_measured="not measured"
        cold_start_budget="$(read_property "$budgets" coldStart.maxMillis)"
        cold_start_status="NOT RUN"

        if [[ -f "$aar_report" ]]; then
          aar_measured="$(read_property "$aar_report" measuredBytes)"
          aar_status="$(read_property "$aar_report" status)"
        fi
        if [[ -f "$cold_start_report" ]]; then
          cold_start_measured="$(read_property "$cold_start_report" measuredMillis)"
          cold_start_status="$(read_property "$cold_start_report" status)"
        fi

        {
          echo "### Android library budgets"
          echo
          echo "| Gate | Measured | Budget | Status |"
          echo "| --- | ---: | ---: | :---: |"
          echo "| Release AAR size | ${aar_measured} bytes | ${aar_budget} bytes | ${aar_status} |"
          echo "| Offline cold start | ${cold_start_measured} ms | ${cold_start_budget} ms | ${cold_start_status} |"
        } >> "$GITHUB_STEP_SUMMARY"

        consumer_reports="android/consumer-r8-smoke/build/reports/r8-consumer"
        size_report="$consumer_reports/consumer-apk-size.properties"
        {
          echo
          echo "### R8-minified consumer (consumer-r8-smoke)"
          echo
          echo "| Gate | Findings | Status |"
          echo "| --- | ---: | :---: |"
          for gate in openmedkitRelease missingKeepRuleRelease; do
            report="$consumer_reports/${gate}-r8-gate.properties"
            if [[ -f "$report" ]]; then
              echo "| ${gate} R8 gate | $(read_property "$report" findings) | $(read_property "$report" status) |"
            else
              echo "| ${gate} R8 gate | not measured | NOT RUN |"
            fi
          done
          echo
          echo "| ABI | OpenMedKit adds | Budget | APK | Status |"
          echo "| --- | ---: | ---: | ---: | :---: |"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            budget="$(read_property "$budgets" "consumerApk.${abi}.maxDeltaBytes")"
            if [[ -f "$size_report" ]]; then
              echo "| ${abi} | $(read_property "$size_report" "${abi}.deltaBytes") bytes | ${budget} bytes | $(read_property "$size_report" "${abi}.apkBytes") bytes | $(read_property "$size_report" "${abi}.status") |"
            else
              echo "| ${abi} | not measured | ${budget} bytes | not measured | NOT RUN |"
            fi
          done
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload unit test report
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: android-unit-test-report
        path: |
          android/openmedkit/build/reports/tests/testDebugUnitTest/
          android/openmedkit/build/test-results/testDebugUnitTest/
          android/openmedkit/build/reports/budgets/
          android/consumer-r8-smoke/build/reports/
          android/consumer-r8-smoke/build/outputs/mapping/*/mapping.txt
          android/consumer-r8-smoke/build/outputs/mapping/*/usage.txt
        if-no-files-found: ignore
