name: SDK Release Candidate

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/sdk-release-candidate.yml'
      - 'openmed/__about__.py'
      - 'openmed/eval/release_readiness.py'
      - 'CHANGELOG.md'
      - 'docs/migration/**'
  workflow_dispatch:
    inputs:
      version:
        description: Stable SDK version to prepare.
        required: true
        default: 4.0.0
      api_base_ref:
        description: Previous stable SDK tag.
        required: true
        default: v3.0.0
      migration_guide:
        description: Reviewed migration guide for this SDK candidate.
        required: true
        default: docs/migration/3.0-to-4.0.md

permissions:
  contents: read

concurrency:
  group: sdk-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      REQUESTED_VERSION: ${{ inputs.version || '4.0.0' }}
      REQUESTED_API_BASE: ${{ inputs.api_base_ref || 'v3.0.0' }}
      REQUESTED_MIGRATION: ${{ inputs.migration_guide || 'docs/migration/3.0-to-4.0.md' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - name: Install locked gate dependencies
        run: uv sync --frozen --extra dev --python 3.11
      - name: Resolve candidate scope and immutable inputs
        id: candidate
        run: |
          uv run --frozen python - <<'PY'
          import ast
          import json
          import os
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          def version_from_source(source):
              tree = ast.parse(source)
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id == "__version__"
                      for target in node.targets
                  ):
                      value = ast.literal_eval(node.value)
                      if isinstance(value, str) and re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", value):
                          return value
              raise SystemExit("candidate metadata must declare a stable SDK version")

          head_source = subprocess.check_output(
              ["git", "show", os.environ["CANDIDATE_SHA"] + ":openmed/__about__.py"],
              text=True,
          )
          declared = version_from_source(head_source)
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              base_source = subprocess.check_output(
                  ["git", "show", os.environ["PR_BASE_SHA"] + ":openmed/__about__.py"],
                  text=True,
              )
              base = version_from_source(base_source)
              version = declared
              api_base = "v" + base
              evaluate = version != base
              source_line = ".".join(base.split(".")[:2])
              target_line = ".".join(version.split(".")[:2])
              migration = ""
              if evaluate:
                  if tuple(map(int, version.split("."))) <= tuple(map(int, base.split("."))):
                      raise SystemExit("candidate version must increase over its PR base")
                  if source_line == target_line:
                      guides = sorted(Path("docs/migration").glob("*-to-" + target_line + ".md"))
                      if len(guides) != 1:
                          raise SystemExit("patch candidate requires one existing migration guide")
                      migration = guides[0].as_posix()
                  else:
                      migration = "docs/migration/" + source_line + "-to-" + target_line + ".md"
          else:
              version = os.environ["REQUESTED_VERSION"]
              api_base = os.environ["REQUESTED_API_BASE"]
              migration = os.environ["REQUESTED_MIGRATION"]
              evaluate = True
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("invalid stable candidate version")
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", api_base):
              raise SystemExit("invalid stable API baseline tag")
          if evaluate:
              guide = PurePosixPath(migration)
              if guide.is_absolute() or ".." in guide.parts or "\n" in migration or "\r" in migration or guide.suffix != ".md":
                  raise SystemExit("migration guide must be a relative Markdown path")
          outputs = {
              "evaluate": str(evaluate).lower(), "version": version,
              "api_base": api_base, "migration": migration,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              for key, value in outputs.items():
                  stream.write(key + "=" + value + "\n")
          evidence = {
              "schema_version": 1, "candidate_sha": os.environ["CANDIDATE_SHA"],
              "declared_version": declared, "requested_version": version,
              "api_base_ref": api_base, "migration_guide": migration,
              "classification": "CANDIDATE" if evaluate else "NOT_A_CANDIDATE",
              "release_readiness_required": evaluate,
          }
          Path("artifacts/sdk-readiness").mkdir(parents=True, exist_ok=True)
          Path("artifacts/sdk-readiness/scope.json").write_text(json.dumps(evidence, indent=2) + "\n")
          if not evaluate:
              print("SDK version unchanged: ordinary PR; no release readiness decision produced")
          PY
      - name: Check version and API compatibility
        if: steps.candidate.outputs.evaluate == 'true'
        env:
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          API_BASE_REF: ${{ steps.candidate.outputs.api_base }}
          MIGRATION_GUIDE: ${{ steps.candidate.outputs.migration }}
        run: |
          uv run --frozen python scripts/release/check_release_version.py --version "$RELEASE_VERSION"
          mkdir -p artifacts/sdk-readiness
          uv run --frozen python scripts/release/api_surface_diff.py \
            "$API_BASE_REF" "$CANDIDATE_SHA" \
            --json artifacts/sdk-readiness/api-compat.json \
            --check "$MIGRATION_GUIDE"
      - name: Run end-to-end golden suite
        if: steps.candidate.outputs.evaluate == 'true'
        run: |
          uv run --frozen pytest \
            tests/integration/test_end_to_end.py \
            tests/unit/eval/test_golden_fixtures.py \
            tests/unit/eval/test_i18n_golden_fixtures.py \
            tests/integration/test_v3_golden_journey.py \
            tests/integration/test_v3_journey_release_gate.py \
            tests/integration/test_clinical_pipeline_e2e.py \
            --junitxml=artifacts/sdk-readiness/golden.xml -q
          uv run --frozen python - <<'PY'
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse("artifacts/sdk-readiness/golden.xml").getroot()
          cases = list(root.iter("testcase"))
          failed = any(case.find("failure") is not None or case.find("error") is not None for case in cases)
          executed = sum(case.find("skipped") is None for case in cases)
          if failed or executed == 0:
              raise SystemExit("golden suite has failures or no executed tests")
          Path("artifacts/sdk-readiness/e2e.json").write_text(json.dumps({
              "passed": True, "suite": "golden_v3", "executed": executed,
              "head_sha": os.environ["CANDIDATE_SHA"],
          }, indent=2) + "\n")
          PY
      - name: Verify SDK readiness without model promotion
        if: steps.candidate.outputs.evaluate == 'true'
        env:
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          API_BASE_REF: ${{ steps.candidate.outputs.api_base }}
          MIGRATION_GUIDE: ${{ steps.candidate.outputs.migration }}
        run: |
          uv run --frozen python -m openmed.eval.release_readiness \
            --sdk-baseline "$API_BASE_REF" \
            --migration-guide "$MIGRATION_GUIDE" \
            --api-compat-report artifacts/sdk-readiness/api-compat.json \
            --e2e-report artifacts/sdk-readiness/e2e.json \
            --version "$RELEASE_VERSION" \
            --output artifacts/sdk-readiness/readiness.json --json
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-release-readiness
          if-no-files-found: error
          path: artifacts/sdk-readiness/
