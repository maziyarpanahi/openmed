name: Format Parser Fuzzing

on:
  schedule:
    # Weekly, bounded exploration of untrusted document parser inputs.
    - cron: "43 4 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz-format-parsers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Install dependencies
      run: |
        uv sync --frozen --extra dev --python 3.11

    - name: Run bounded format parser fuzzing
      env:
        HYPOTHESIS_PROFILE: fuzz-nightly
        OPENMED_FORMAT_PARSER_TIMEOUT_SECONDS: "0.5"
      run: |
        uv run pytest tests/fuzz/test_format_parsers_fuzz.py -q -m fuzz
