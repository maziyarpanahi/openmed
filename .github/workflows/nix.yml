name: Nix

on:
  push:
    branches: [main, master, develop]
    paths:
      - ".github/workflows/nix.yml"
      - "flake.lock"
      - "flake.nix"
      - "openmed/**"
      - "pyproject.toml"
      - "tests/**"
  # Pull requests rebuild the shell only when its inputs change. Pushes to
  # master that touch the package or tests still build it and run the full
  # suite inside it.
  pull_request:
    branches: [main, master, develop]
    paths:
      - ".github/workflows/nix.yml"
      - "flake.lock"
      - "flake.nix"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs of the same pull request. Pushes, tags and scheduled
# runs each get their own group, so they always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake-check:
    name: Build package and dev shell
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Check flake outputs
        run: nix flake check --print-build-logs

      - name: Run the test suite in the dev shell
        run: nix develop --command python -m pytest tests/ -q
