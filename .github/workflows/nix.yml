name: Nix

on:
  push:
    branches: [main, master, develop, 'release/v*' ]
    paths:
      - ".github/workflows/nix.yml"
      - "flake.lock"
      - "flake.nix"
      - "openmed/**"
      - "pyproject.toml"
      - "tests/**"
  # Pull requests rebuild the dev shell only when its inputs change; pushes
  # to the default branches keep checking it against every code change.
  pull_request:
    branches: [main, master, develop, 'release/v*' ]
    paths:
      - ".github/workflows/nix.yml"
      - "flake.lock"
      - "flake.nix"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake-check:
    name: Build package and dev shell
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Check flake outputs
        run: nix flake check --print-build-logs

      - name: Run the test suite in the dev shell
        # The full tier runs in ci.yml; here the shell only has to carry the
        # fast tier. Nix's pyarrow links a shared libprotobuf whose symbols
        # clash with the protobuf grpcio-tools embeds, so loading protoc
        # in-process after pyarrow crashes the interpreter. The API schema
        # tests compile the gRPC contract in-process and never use pyarrow, so
        # they run in a process of their own.
        run: >-
          nix develop --command python -m pytest tests/ -q -m "not slow and not fuzz"
          --ignore=tests/unit/service/test_api_schema_compatibility.py

      - name: Run the in-process protobuf contract tests in their own process
        run: >-
          nix develop --command python -m pytest
          tests/unit/service/test_api_schema_compatibility.py -q
          -m "not slow and not fuzz"
