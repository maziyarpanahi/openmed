name: Example Notebooks Execution & Output Check

on:
  push:
    branches: [main, master, develop]
    paths:
      - "examples/notebooks/**"
      - "scripts/check_notebooks.py"
      - "tests/unit/test_notebook_gallery.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/notebooks-execute.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "examples/notebooks/**"
      - "scripts/check_notebooks.py"
      - "tests/unit/test_notebook_gallery.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/notebooks-execute.yml"

permissions:
  contents: read

jobs:
  notebooks-offline-execute:
    name: Execute Gallery Notebooks (Offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.11

      - name: Run lightweight notebook output check
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: .venv/bin/python scripts/check_notebooks.py

      - name: Execute gallery notebooks in a real kernel
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: .venv/bin/python -m pytest tests/unit/test_notebook_gallery.py -v
