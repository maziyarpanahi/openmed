name: Swift Package (OpenMedKit)

on:
  push:
    branches: [main, master, 'release/v*' ]
    paths:
      - '.swift-format'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/format_swift.sh'
      - 'scripts/lint_swift.sh'
      - 'swift/**'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/parity/multimodal_contract_v1.json'
      - 'tests/fixtures/multimodal/local_review_v1.json'
      - 'tests/fixtures/parity/speech_contract_v1.json'
      - 'tests/fixtures/multimodal/ambient_session_transitions.json'
      - 'tests/fixtures/portable_bundle/**'
      - 'tests/fixtures/portable_bundle_calibration/**'
  pull_request:
    branches: [main, master, 'release/v*' ]
    paths:
      - '.swift-format'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/format_swift.sh'
      - 'scripts/lint_swift.sh'
      - 'swift/**'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/parity/multimodal_contract_v1.json'
      - 'tests/fixtures/multimodal/local_review_v1.json'
      - 'tests/fixtures/parity/speech_contract_v1.json'
      - 'tests/fixtures/multimodal/ambient_session_transitions.json'
      - 'tests/fixtures/portable_bundle/**'
      - 'tests/fixtures/portable_bundle_calibration/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test OpenMedKit
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Lint Swift formatting
      run: scripts/lint_swift.sh

    - name: Resolve documented root package dependencies
      run: swift package resolve

    - name: Build documented root package
      run: swift build

    - name: Test documented root package
      run: swift test

    - name: Test Unicode scalar offset parity fixture
      run: swift test --filter OffsetContractParityTests

  build-ios:
    name: Build for iOS
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Build for iOS simulator
      working-directory: swift/OpenMedKit
      run: |
        xcodebuild build \
          -scheme OpenMedKit-Package \
          -destination 'generic/platform=iOS Simulator' \
          -skipPackagePluginValidation

  build-watchos:
    name: Build & Test watchOS Simulator
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Select available watchOS simulator
      id: destination
      shell: bash
      run: |
        set -euo pipefail
        udid="$(
          xcrun simctl list devices available --json |
            jq -r '[
              .devices | to_entries[] |
              select(.key | contains("watchOS")) |
              .value[] |
              select(.isAvailable == true) |
              .udid
            ][0] // empty'
        )"
        test -n "$udid"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    - name: Build and run watchOS parity tests
      working-directory: swift/OpenMedKit
      run: |
        xcodebuild test \
          -scheme OpenMedKit-Package \
          -destination 'platform=watchOS Simulator,id=${{ steps.destination.outputs.udid }}' \
          -only-testing:OpenMedKitTests/WatchVisionParityTests \
          -skipPackagePluginValidation

  build-visionos:
    name: Build & Test visionOS Simulator
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Select available visionOS simulator
      id: destination
      shell: bash
      run: |
        set -euo pipefail
        udid="$(
          xcrun simctl list devices available --json |
            jq -r '[
              .devices | to_entries[] |
              select(.key | contains("xrOS")) |
              .value[] |
              select(.isAvailable == true) |
              .udid
            ][0] // empty'
        )"
        test -n "$udid"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    # SwiftPM's command-line planner cannot infer dynamic library extensions for xrOS.
    # Pin the native SDK and products directory: a destination can also advertise
    # iPad compatibility, which otherwise makes XCTest look in Debug-iphonesimulator.
    - name: Build native visionOS simulator target and tests
      working-directory: swift/OpenMedKit
      run: |
        xcodebuild build-for-testing \
          -scheme OpenMedKit-Package \
          -sdk xrsimulator \
          -destination 'id=${{ steps.destination.outputs.udid }}' \
          -skipPackagePluginValidation \
          SUPPORTED_PLATFORMS=xrsimulator SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD=NO \
          CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/openmed-vision-products"

    - name: Run native visionOS parity tests
      shell: bash
      env:
        VISION_DEVICE: ${{ steps.destination.outputs.udid }}
      run: |
        set -euo pipefail
        platform="$(xcrun --sdk xrsimulator --show-sdk-platform-path)/Developer"
        products="$RUNNER_TEMP/openmed-vision-products"
        bundle="$products/OpenMedKitTests.xctest"
        xcrun vtool -show-build "$bundle/OpenMedKitTests" | grep -F 'platform VISIONOSSIMULATOR'
        xcrun simctl bootstatus "$VISION_DEVICE" -b
        export SIMCTL_CHILD_DYLD_FRAMEWORK_PATH="$platform/Library/Frameworks:$products"
        export SIMCTL_CHILD_DYLD_LIBRARY_PATH="$platform/usr/lib:$products"
        xcrun simctl spawn "$VISION_DEVICE" "$platform/Library/Xcode/Agents/xctest" \
          -XCTest OpenMedKitTests.WatchVisionParityTests "$bundle" 2>&1 | tee "$RUNNER_TEMP/openmed-vision-parity.log"
        grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/openmed-vision-parity.log"
