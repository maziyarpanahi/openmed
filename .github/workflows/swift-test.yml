name: Swift Package (OpenMedKit)

on:
  push:
    branches: [main, master, 'release/v*' ]
    paths:
      - '.swift-format'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/check_swift_root_consumer.sh'
      - 'scripts/format_swift.sh'
      - 'scripts/lint_swift.sh'
      - 'scripts/release/check_swift_manifest_drift.py'
      - 'scripts/release/check_swift_strict_concurrency.py'
      - 'scripts/release/check_native_api_migration.py'
      - 'scripts/release/swift_api_baseline.py'
      - 'swift/**'
      - 'fixtures/parity/**'
      - 'scripts/parity/**'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/parity/kit_parity_vectors.json'
      - 'tests/fixtures/parity/portable_policy_vectors.json'
      - 'openmed/core/policies/**'
      - 'openmed/core/labels.py'
      - 'openmed/core/thresholds.json'
      - 'openmed/core/portable_policy.py'
      - 'tests/fixtures/parity/multimodal_contract_v1.json'
      - 'tests/fixtures/parity/document_intake_v1.json'
      - 'tests/fixtures/multimodal/local_review_v1.json'
      - 'tests/fixtures/parity/speech_contract_v1.json'
      - 'tests/fixtures/parity/tokenizer/**'
      - 'tests/fixtures/multimodal/ambient_session_transitions.json'
      - 'tests/fixtures/portable_bundle/**'
      - 'tests/fixtures/device_capabilities/**'
      - 'tests/fixtures/bundle_cache/**'
  pull_request:
    branches: [main, master, 'release/v*' ]
    paths:
      - '.swift-format'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/check_swift_root_consumer.sh'
      - 'scripts/format_swift.sh'
      - 'scripts/lint_swift.sh'
      - 'scripts/release/check_swift_manifest_drift.py'
      - 'scripts/release/check_swift_strict_concurrency.py'
      - 'scripts/release/check_native_api_migration.py'
      - 'scripts/release/swift_api_baseline.py'
      - 'swift/**'
      - 'fixtures/parity/**'
      - 'scripts/parity/**'
      - 'tests/fixtures/parity/offset_contract.json'
      - 'tests/fixtures/parity/kit_parity_vectors.json'
      - 'tests/fixtures/parity/portable_policy_vectors.json'
      - 'openmed/core/policies/**'
      - 'openmed/core/labels.py'
      - 'openmed/core/thresholds.json'
      - 'openmed/core/portable_policy.py'
      - 'tests/fixtures/parity/multimodal_contract_v1.json'
      - 'tests/fixtures/parity/document_intake_v1.json'
      - 'tests/fixtures/multimodal/local_review_v1.json'
      - 'tests/fixtures/parity/speech_contract_v1.json'
      - 'tests/fixtures/parity/tokenizer/**'
      - 'tests/fixtures/multimodal/ambient_session_transitions.json'
      - 'tests/fixtures/portable_bundle/**'
      - 'tests/fixtures/device_capabilities/**'
      - 'tests/fixtures/bundle_cache/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test OpenMedKit
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Lint Swift formatting
      run: scripts/lint_swift.sh

    - name: Check root and nested manifest drift
      run: python3 scripts/release/check_swift_manifest_drift.py

    - name: Resolve documented root package dependencies
      run: swift package resolve

    - name: Build documented root package
      run: swift build

    - name: Check macOS Swift public API baseline
      run: >-
        python3 scripts/release/swift_api_baseline.py --platform macos --check
        --write-current "$RUNNER_TEMP/swift-api-current/macos"

    - name: Upload regenerated macOS Swift API baseline
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: swift-api-baseline-macos
        path: ${{ runner.temp }}/swift-api-current/macos
        if-no-files-found: ignore

    - name: Test documented root package
      run: swift test

    - name: Test Unicode scalar offset parity fixture
      run: swift test --filter OffsetContractParityTests

    - name: Build versioned root-package consumer for macOS
      run: scripts/check_swift_root_consumer.sh macos

  strict-concurrency:
    name: Strict concurrency (macOS and iOS)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    # The package keeps the Swift 5 language mode for consumers; this lane fails on
    # any first-party diagnostic under the Swift 6 complete data-race checks.
    - name: Build root package and tests with complete concurrency checking
      run: python3 scripts/release/check_swift_strict_concurrency.py --platform macos

    - name: Build library and extension targets for iOS with complete concurrency checking
      run: python3 scripts/release/check_swift_strict_concurrency.py --platform ios

    - name: Run concurrent-use tests under Thread Sanitizer
      run: >-
        swift test --sanitize=thread
        --filter 'ConcurrencySafetyTests|SpeechDecoderProgressConcurrencyTests'

    - name: Test Swift-Kotlin span-equivalence fixture
      run: swift test --filter SpanEquivalenceParityTests

    - name: Test kit-parity result profile vectors
      run: swift test --filter KitParityVectorTests

    - name: Test portable policy decision vectors
      run: swift test --filter PortablePolicyVectorTests

  api-baseline-ios:
    name: Check iOS Swift API baseline
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    # The iOS dump covers the UIKit-only Share and Action extension targets.
    - name: Build documented root package for iOS simulator
      run: |
        xcodebuild build \
          -scheme OpenMedKit-Package \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath .build/xcode-ios \
          -skipPackagePluginValidation

    - name: Check iOS Swift public API baseline
      run: >-
        python3 scripts/release/swift_api_baseline.py --platform ios --check
        --write-current "$RUNNER_TEMP/swift-api-current/ios"

    - name: Upload regenerated iOS Swift API baseline
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: swift-api-baseline-ios
        path: ${{ runner.temp }}/swift-api-current/ios
        if-no-files-found: ignore

  api-migration-policy:
    name: Require migration notes for Swift API breaks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    # A pull_request checkout is the merge commit; HEAD^1 is the base tip.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 2

    - name: Compare Swift API baselines with docs/migration
      run: >-
        python3 scripts/release/check_native_api_migration.py
        --platform swift --base HEAD^1 --head HEAD

    - name: Test portable tokenizer conformance vectors
      run: swift test --filter TokenizerConformanceTests

  build-ios:
    name: Build for iOS
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Build for iOS simulator
      working-directory: swift/OpenMedKit
      run: |
        xcodebuild build \
          -scheme OpenMedKit-Package \
          -destination 'generic/platform=iOS Simulator' \
          -skipPackagePluginValidation

    - name: Build versioned root-package consumer for iOS
      run: scripts/check_swift_root_consumer.sh ios

  build-watchos:
    name: Build & Test watchOS Simulator
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Select available watchOS simulator
      id: destination
      shell: bash
      run: |
        set -euo pipefail
        udid="$(
          xcrun simctl list devices available --json |
            jq -r '[
              .devices | to_entries[] |
              select(.key | contains("watchOS")) |
              .value[] |
              select(.isAvailable == true) |
              .udid
            ][0] // empty'
        )"
        test -n "$udid"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    - name: Build and run watchOS parity tests
      working-directory: swift/OpenMedKit
      run: |
        xcodebuild test \
          -scheme OpenMedKit-Package \
          -destination 'platform=watchOS Simulator,id=${{ steps.destination.outputs.udid }}' \
          -only-testing:OpenMedKitTests/WatchVisionParityTests \
          -skipPackagePluginValidation

  build-visionos:
    name: Build & Test visionOS Simulator
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Select available visionOS simulator
      id: destination
      shell: bash
      run: |
        set -euo pipefail
        udid="$(
          xcrun simctl list devices available --json |
            jq -r '[
              .devices | to_entries[] |
              select(.key | contains("xrOS")) |
              .value[] |
              select(.isAvailable == true) |
              .udid
            ][0] // empty'
        )"
        test -n "$udid"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    # SwiftPM's command-line planner cannot infer dynamic library extensions for xrOS.
    # Pin the native SDK and products directory: a destination can also advertise
    # iPad compatibility, which otherwise makes XCTest look in Debug-iphonesimulator.
    - name: Build native visionOS simulator target and tests
      working-directory: swift/OpenMedKit
      run: |
        xcodebuild build-for-testing \
          -scheme OpenMedKit-Package \
          -sdk xrsimulator \
          -destination 'id=${{ steps.destination.outputs.udid }}' \
          -skipPackagePluginValidation \
          SUPPORTED_PLATFORMS=xrsimulator SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD=NO \
          CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/openmed-vision-products"

    - name: Run native visionOS parity tests
      shell: bash
      env:
        VISION_DEVICE: ${{ steps.destination.outputs.udid }}
      run: |
        set -euo pipefail
        platform="$(xcrun --sdk xrsimulator --show-sdk-platform-path)/Developer"
        products="$RUNNER_TEMP/openmed-vision-products"
        bundle="$products/OpenMedKitTests.xctest"
        xcrun vtool -show-build "$bundle/OpenMedKitTests" | grep -F 'platform VISIONOSSIMULATOR'
        xcrun simctl bootstatus "$VISION_DEVICE" -b
        export SIMCTL_CHILD_DYLD_FRAMEWORK_PATH="$platform/Library/Frameworks:$products"
        export SIMCTL_CHILD_DYLD_LIBRARY_PATH="$platform/usr/lib:$products"
        xcrun simctl spawn "$VISION_DEVICE" "$platform/Library/Xcode/Agents/xctest" \
          -XCTest OpenMedKitTests.WatchVisionParityTests "$bundle" 2>&1 | tee "$RUNNER_TEMP/openmed-vision-parity.log"
        grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/openmed-vision-parity.log"

  test-ios-simulator:
    name: Test iOS Simulator
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Select available iOS simulator
      id: destination
      shell: bash
      run: |
        set -euo pipefail
        udid="$(
          xcrun simctl list devices available --json |
            jq -r '[
              .devices | to_entries[] |
              select(.key | contains("iOS")) |
              .value[] |
              select(.isAvailable == true and (.name | startswith("iPhone"))) |
              .udid
            ][0] // empty'
        )"
        test -n "$udid"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    # MLX cannot run on the Simulator. Its entry points refuse with
    # OpenMedMLXRuntimeError.unsupportedPlatform and MLX-dependent tests skip,
    # so CoreML, policy, offset and extension tests run here instead.
    - name: Run OpenMedKit and extension tests on the iOS Simulator
      working-directory: swift/OpenMedKit
      shell: bash
      run: |
        set -euo pipefail
        xcodebuild test \
          -scheme OpenMedKit-Package \
          -destination 'platform=iOS Simulator,id=${{ steps.destination.outputs.udid }}' \
          -only-testing:OpenMedKitTests \
          -only-testing:ExtensionTests \
          -skipPackagePluginValidation 2>&1 | tee "$RUNNER_TEMP/openmed-ios-simulator-tests.log"

    - name: Report tests skipped on the iOS Simulator
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/openmed-ios-simulator-tests.log"
        skipped="$RUNNER_TEMP/openmed-ios-simulator-skipped.txt"
        test -f "$log"
        { grep -E '\] : Test skipped - ' "$log" || true; } |
          sed -E 's/.*-\[[^. ]+\.([^ ]+) ([^]]+)\] : Test skipped - (.*)$/\1.\2: \3/' |
          sort -u > "$skipped"
        {
          echo "### Tests skipped on the iOS Simulator"
          echo
          if [ -s "$skipped" ]; then sed 's/^/- /' "$skipped"; else echo "None."; fi
        } >> "$GITHUB_STEP_SUMMARY"
        cat "$skipped"
        # MLX-dependent tests must be reported as skipped, never run or crash.
        grep -Fq 'MLX cannot run on the iOS Simulator' "$skipped"
        if grep -Fq 'Restarting after unexpected exit, crash, or test timeout' "$log"; then
          echo "A test crashed the iOS Simulator test runner." >&2
          exit 1
        fi
