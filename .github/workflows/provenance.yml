name: Release Provenance

on:
  workflow_call:
    inputs:
      distribution-artifact-name:
        description: Name to use for the wheel and sdist workflow artifact.
        required: false
        type: string
        default: python-package-distributions
      release-tag:
        description: Immutable vX.Y.Z tag to build during a recovery dispatch.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  python-distributions:
    name: Build, attest, and verify Python distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release-tag || github.ref }}

      - name: Verify release source ref
        if: inputs.release-tag != '' || github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z: $RELEASE_TAG"
            exit 1
          fi
          TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
          CHECKED_OUT_COMMIT=$(git rev-parse HEAD)
          if [ "$CHECKED_OUT_COMMIT" != "$TAG_COMMIT" ]; then
            echo "Checked-out commit $CHECKED_OUT_COMMIT != $RELEASE_TAG commit $TAG_COMMIT"
            exit 1
          fi
          python3 - "$RELEASE_TAG" "$TAG_COMMIT" <<'PY'
          import json
          import os
          import sys

          payload = {
              "release_commit": sys.argv[2],
              "release_tag": sys.argv[1],
              "workflow_ref": os.environ["GITHUB_REF"],
              "workflow_sha": os.environ["GITHUB_SHA"],
          }
          with open("release-source.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine 'hatchling==1.31.0'

      - name: Clean package cache
        run: |
          pip uninstall openmed -y || true
          rm -rf ~/.cache/pip || true

      - name: Clean build artifacts
        run: |
          rm -rf dist build

      - name: Enforce repo file policy
        run: |
          python scripts/release/check_repo_policy.py

      - name: Compute release metadata
        id: release_metadata
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          WORKFLOW_CHANGELOG="$RUNNER_TEMP/openmed-changelog.py"
          git show \
            "${WORKFLOW_REVISION}:scripts/release/changelog.py" \
            > "$WORKFLOW_CHANGELOG"
          test -s "$WORKFLOW_CHANGELOG"

          release_version_args=()
          if [ -n "${RELEASE_TAG:-}" ] && [[ "$RELEASE_TAG" == v* ]]; then
            RELEASE_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${RELEASE_COMMIT}^" 2>/dev/null || true)
            RANGE_END="$RELEASE_COMMIT"
            release_version_args=(--release-version "${RELEASE_TAG#v}")
          else
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            RANGE_END="HEAD"
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            BASE_VERSION="${PREVIOUS_TAG#v}"
            RANGE="${PREVIOUS_TAG}..${RANGE_END}"
          else
            BASE_VERSION="0.0.0"
            RANGE="$RANGE_END"
          fi

          python "$WORKFLOW_CHANGELOG" \
            --repo "$GITHUB_WORKSPACE" \
            --range "$RANGE" \
            --current-version "$BASE_VERSION" \
            "${release_version_args[@]}" \
            --github-output

      - name: Verify version matches tag
        if: inputs.release-tag != '' || github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
        run: |
          VERSION=$(python -c "import pathlib, re; content = pathlib.Path('openmed/__about__.py').read_text(); print(re.search(r'__version__\\s*=\\s*\"([^\"]+)\"', content).group(1))")
          TAG_VERSION=${RELEASE_TAG#v}
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package version $VERSION != tag version $TAG_VERSION"
            exit 1
          fi

      - name: Verify API compatibility and migration guide
        if: inputs.release-tag != '' || github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${RELEASE_COMMIT}^")
          BASE_VERSION=${PREVIOUS_TAG#v}
          RELEASE_VERSION=${RELEASE_TAG#v}
          BASE_SERIES=${BASE_VERSION%.*}
          RELEASE_SERIES=${RELEASE_VERSION%.*}
          API_ARGS=(
            "$PREVIOUS_TAG"
            "$RELEASE_COMMIT"
            --json "$RUNNER_TEMP/api-surface-diff.json"
          )
          if [ "$BASE_SERIES" != "$RELEASE_SERIES" ]; then
            MIGRATION_GUIDE="docs/migration/${BASE_SERIES}-to-${RELEASE_SERIES}.md"
            API_ARGS+=(--check "$MIGRATION_GUIDE")
          fi
          python scripts/release/api_surface_diff.py "${API_ARGS[@]}"

      - name: Build package
        run: |
          python -m build --no-isolation

      - name: Verify distribution metadata compatibility
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel and one source distribution."
            exit 1
          fi

          wheel_metadata_version=$(unzip -p "${wheels[0]}" '*/METADATA' \
            | awk -F ': ' '$1 == "Metadata-Version" { print $2; exit }')
          sdist_metadata_path=$(tar -tzf "${sdists[0]}" \
            | awk '/\/PKG-INFO$/ { print; exit }')
          sdist_metadata_version=$(tar -xOf "${sdists[0]}" "$sdist_metadata_path" \
            | awk -F ': ' '$1 == "Metadata-Version" { print $2; exit }')
          if [ "$wheel_metadata_version" != "2.4" ] \
             || [ "$sdist_metadata_version" != "2.4" ]; then
            echo "Unsupported distribution metadata versions: wheel=$wheel_metadata_version sdist=$sdist_metadata_version"
            exit 1
          fi

      - name: Check package
        run: |
          twine check dist/*

      - name: Build release artifact digest manifest
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found in dist/."
            exit 1
          fi

          wheel_count=0
          sdist_count=0
          : > release-artifact-digests.txt
          for artifact in "${artifacts[@]}"; do
            name="$(basename "$artifact")"
            case "$name" in
              *.whl) wheel_count=$((wheel_count + 1)) ;;
              *.tar.gz) sdist_count=$((sdist_count + 1)) ;;
              *)
                echo "Unexpected release artifact: $name"
                exit 1
                ;;
            esac
            digest="$(sha256sum "$artifact" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$name" >> release-artifact-digests.txt
          done

          if [ "$wheel_count" -eq 0 ] || [ "$sdist_count" -eq 0 ]; then
            echo "Expected at least one wheel and one source distribution."
            exit 1
          fi
          sort -k 2 -o release-artifact-digests.txt release-artifact-digests.txt
          cat release-artifact-digests.txt

      - name: Generate SLSA provenance for distributions
        id: attest-distributions
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-checksums: release-artifact-digests.txt

      - name: Preserve distribution attestation bundle
        if: steps.attest-distributions.outcome == 'success'
        shell: bash
        run: |
          mkdir -p provenance-bundles
          test -s "${{ steps.attest-distributions.outputs.bundle-path }}"
          cp "${{ steps.attest-distributions.outputs.bundle-path }}" \
            provenance-bundles/python-distributions.intoto.json

      - name: Verify distribution provenance
        if: steps.attest-distributions.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p provenance-verification
          shopt -s nullglob
          artifacts=(dist/*)
          for artifact in "${artifacts[@]}"; do
            name="$(basename "$artifact")"
            output="provenance-verification/${name}.json"
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/provenance.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --format json > "$output"
            python3 - "$output" <<'PY'
          import json
          import os
          import sys

          payload = json.loads(open(sys.argv[1], encoding="utf-8").read())
          blob = json.dumps(payload, sort_keys=True)
          required = [
              "https://slsa.dev/provenance/v1",
              os.environ["GITHUB_SHA"],
              ".github/workflows/provenance.yml",
          ]
          missing = [value for value in required if value not in blob]
          if missing:
              raise SystemExit(f"provenance verification output missing: {missing}")
          PY
          done

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.distribution-artifact-name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload provenance evidence
        if: steps.attest-distributions.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: release-provenance
          path: |
            release-artifact-digests.txt
            release-source.json
            provenance-bundles/*.json
            provenance-verification/*.json
          if-no-files-found: error
          retention-days: 90
