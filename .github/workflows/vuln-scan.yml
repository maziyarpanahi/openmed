name: Vulnerability Scan

on:
  push:
    branches: [main, master, develop, 'release/v*' ]
    paths:
      - ".github/workflows/vuln-scan.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "deploy/security/cve-allowlist.yaml"
      - "scripts/security/vulnerability_scan_gate.py"
      - "tests/unit/security/test_vulnerability_scan_gate.py"
      - "openmed/**"
      - "tests/fixtures/security/trivy-high-vulnerability.json"
      - ".github/actions/setup-trivy/**"
      - "Package.resolved"
      - "swift/**/Package.resolved"
      - "js/**/package-lock.json"
      - "js/**/Cargo.lock"
      - "clients/**/package-lock.json"
      - "android/**/gradle.lockfile"
      - "scripts/security/gradle_lockfile_view.py"
      - "tests/fixtures/security/kit-lockfiles/**"
      - "tests/unit/security/test_kit_lockfile_scan.py"
  pull_request:
    branches: [main, master, develop, 'release/v*' ]
    paths:
      - ".github/workflows/vuln-scan.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "deploy/security/cve-allowlist.yaml"
      - "scripts/security/vulnerability_scan_gate.py"
      - "tests/unit/security/test_vulnerability_scan_gate.py"
      - "openmed/**"
      - "tests/fixtures/security/trivy-high-vulnerability.json"
      - ".github/actions/setup-trivy/**"
      - "Package.resolved"
      - "swift/**/Package.resolved"
      - "js/**/package-lock.json"
      - "js/**/Cargo.lock"
      - "clients/**/package-lock.json"
      - "android/**/gradle.lockfile"
      - "scripts/security/gradle_lockfile_view.py"
      - "tests/fixtures/security/kit-lockfiles/**"
      - "tests/unit/security/test_kit_lockfile_scan.py"
  workflow_dispatch:
    inputs:
      severity-threshold:
        description: Minimum severity that fails the gate.
        required: false
        default: HIGH

permissions:
  contents: read

env:
  IMAGE_NAME: openmed:ci
  VULN_SCAN_SEVERITY_THRESHOLD: ${{ github.event.inputs.severity-threshold || 'HIGH' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vulnerability-scan:
    name: Scan image and lockfile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install runtime dependencies for gate
        run: |
          uv sync --frozen --python 3.11

      - name: Set up Trivy
        uses: ./.github/actions/setup-trivy

      - name: Build service image
        run: |
          docker build --pull -t "$IMAGE_NAME" .

      - name: Verify gate rejects seeded high severity finding
        run: |
          mkdir -p vulnerability-reports
          set +e
          uv run --no-sync python scripts/security/vulnerability_scan_gate.py \
            --report tests/fixtures/security/trivy-high-vulnerability.json \
            --allowlist deploy/security/cve-allowlist.yaml \
            --output vulnerability-reports/seeded-high-summary.json
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error title=Seeded vulnerability did not fail::Expected the vulnerability gate to reject a HIGH finding above threshold."
            exit 1
          fi

      - name: Verify active waiver suppresses seeded finding
        run: |
          jq 'del(.Results[].Vulnerabilities[].FixedVersion)' \
            tests/fixtures/security/trivy-high-vulnerability.json \
            > "$RUNNER_TEMP/trivy-high-without-fix.json"
          cat > "$RUNNER_TEMP/cve-allowlist-seeded.yaml" <<'YAML'
          version: 1
          policy:
            default_threshold: HIGH
          allowlist:
            - id: CVE-2026-99999
              package: openssl
              expires: 2099-12-31
              reason: Synthetic waiver used only to prove active waivers suppress matching seeded findings.
          YAML
          uv run --no-sync python scripts/security/vulnerability_scan_gate.py \
            --report "$RUNNER_TEMP/trivy-high-without-fix.json" \
            --allowlist "$RUNNER_TEMP/cve-allowlist-seeded.yaml" \
            --output vulnerability-reports/seeded-allowlisted-summary.json

      - name: Scan service image
        run: |
          trivy image \
            --scanners vuln \
            --pkg-types os,library \
            --format json \
            --output vulnerability-reports/trivy-image.json \
            "$IMAGE_NAME"

      - name: Scan dependency lockfile
        run: |
          trivy fs \
            --scanners vuln \
            --pkg-types library \
            --format json \
            --output vulnerability-reports/trivy-lockfile.json \
            uv.lock

      - name: Enforce vulnerability gate
        run: |
          uv run --no-sync python scripts/security/vulnerability_scan_gate.py \
            --report vulnerability-reports/trivy-image.json \
            --report vulnerability-reports/trivy-lockfile.json \
            --lock-report vulnerability-reports/trivy-lockfile.json \
            --lockfile uv.lock \
            --review-extra-only nltk=nltk \
            --allowlist deploy/security/cve-allowlist.yaml \
            --output vulnerability-reports/vulnerability-scan-summary.json

      - name: Generate SARIF reports
        if: always()
        run: |
          mkdir -p vulnerability-reports
          trivy image \
            --scanners vuln \
            --pkg-types os,library \
            --format sarif \
            --output vulnerability-reports/trivy-image.sarif \
            "$IMAGE_NAME" || true
          trivy fs \
            --scanners vuln \
            --pkg-types library \
            --format sarif \
            --output vulnerability-reports/trivy-lockfile.sarif \
            uv.lock || true

      - name: Upload vulnerability findings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: vulnerability-scan-reports
          path: vulnerability-reports/

  kit-lockfile-scan:
    name: Scan OpenMedKit lockfiles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install runtime dependencies for gate
        run: |
          uv sync --frozen --python 3.11

      - name: Set up Trivy
        uses: ./.github/actions/setup-trivy

      - name: Verify kit scan rejects seeded vulnerable lockfiles
        run: |
          # The seeded lockfiles live outside every real scan path under names
          # no scanner recognizes; they get lockfile names only in a temp copy.
          seeded="$RUNNER_TEMP/seeded-kit-lockfiles"
          mkdir -p "$seeded/npm" "$seeded/gradle-source/app" kit-lockfile-reports
          cp tests/fixtures/security/kit-lockfiles/seeded-npm-package-lock.json \
            "$seeded/npm/package-lock.json"
          cp tests/fixtures/security/kit-lockfiles/seeded-gradle-lockfile.txt \
            "$seeded/gradle-source/app/gradle.lockfile"
          uv run --no-sync python scripts/security/gradle_lockfile_view.py \
            --source "$seeded/gradle-source" \
            --output "$seeded/gradle"
          for surface in npm gradle; do
            trivy fs \
              --scanners vuln \
              --pkg-types library \
              --format json \
              --output "$seeded/trivy-$surface.json" \
              "$seeded/$surface"
          done
          summary=kit-lockfile-reports/seeded-kit-lockfile-summary.json
          set +e
          uv run --no-sync python scripts/security/vulnerability_scan_gate.py \
            --report "$seeded/trivy-npm.json" \
            --report "$seeded/trivy-gradle.json" \
            --allowlist deploy/security/cve-allowlist.yaml \
            --output "$summary"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error title=Seeded kit lockfile did not fail::Expected the gate to reject the seeded npm and Gradle lockfiles."
            exit 1
          fi
          for package in lodash org.apache.logging.log4j:log4j-core; do
            if ! jq -e --arg package "$package" \
              'any(.blocking_findings[]; .package == $package and .source_kind == "filesystem")' \
              "$summary" > /dev/null; then
              echo "::error title=Seeded kit finding missing::The gate did not block the seeded $package entry."
              exit 1
            fi
          done
          if jq -e 'any(.findings[]; .package == "com.google.guava:guava")' "$summary" > /dev/null; then
            echo "::error title=Test-only entry scanned::The release runtime view kept a test-only Gradle entry."
            exit 1
          fi

      - name: Scan OpenMedKit lockfiles
        run: |
          # Raw Trivy reports stay in the runner temp directory. Only the gate
          # summary (package names, versions and advisory identifiers) is uploaded.
          raw="$RUNNER_TEMP/kit-lockfile-scans"
          mkdir -p "$raw" kit-lockfile-reports
          uv run --no-sync python scripts/security/gradle_lockfile_view.py \
            --source android \
            --output "$raw/android-release-runtime"
          scan() {
            trivy fs \
              --scanners vuln \
              --pkg-types library \
              --format json \
              --output "$raw/trivy-$1.json" \
              "$2"
          }
          scan swiftpm-root Package.resolved
          scan swiftpm-demos swift
          scan js js
          scan clients clients
          scan android "$raw/android-release-runtime"
          {
            echo "### OpenMedKit lockfiles scanned"
            echo
            echo "| Surface | Lockfiles parsed |"
            echo "| --- | ---: |"
            for report in "$raw"/trivy-*.json; do
              surface="$(basename "$report" .json)"
              count="$(jq '[.Results[]? | select(.Class == "lang-pkgs")] | length' "$report")"
              echo "| ${surface#trivy-} | $count |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce OpenMedKit lockfile gate
        run: |
          raw="$RUNNER_TEMP/kit-lockfile-scans"
          uv run --no-sync python scripts/security/vulnerability_scan_gate.py \
            --report "$raw/trivy-swiftpm-root.json" \
            --report "$raw/trivy-swiftpm-demos.json" \
            --report "$raw/trivy-js.json" \
            --report "$raw/trivy-clients.json" \
            --report "$raw/trivy-android.json" \
            --allowlist deploy/security/cve-allowlist.yaml \
            --output kit-lockfile-reports/kit-lockfile-scan-summary.json

      - name: Upload OpenMedKit lockfile scan summaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: kit-lockfile-scan-summaries
          path: kit-lockfile-reports/
