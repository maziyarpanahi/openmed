name: Summary Release Evidence

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install evaluation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Enforce committed summary evidence
        run: |
          python -m openmed.eval.summary_benchmark --verify \
            eval/suites/summaries/extractive.json \
            eval/suites/summaries/mlx.json
