name: Manifest refresh

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install manifest dependencies
        run: python -m pip install -e . "huggingface-hub>=0.30"

      - name: Regenerate manifest
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
        run: python scripts/manifest/generate_manifest.py --output models.jsonl

      - name: Validate regenerated manifest
        run: python -m scripts.manifest.validate_manifest

      - name: Regenerate registry-derived surfaces
        run: python scripts/release/registry_ctl.py regenerate

      - name: Open manifest refresh PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: feature/refresh-canonical-model-manifest
          base: master
          commit-message: Refresh canonical model manifest
          title: Refresh canonical model manifest
          body: |
            Refreshes the committed model manifest from the live HF org snapshot.
          delete-branch: true
