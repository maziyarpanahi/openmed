name: Set up pinned Trivy
description: Install the pinned Trivy release binary after verifying its SHA-256 checksum

runs:
  using: composite
  steps:
    - name: Install Trivy
      shell: bash
      env:
        TRIVY_VERSION: "0.76.1"
        TRIVY_LINUX_X64_ASSET_ID: "662254617"
        TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
      run: |
        # Verify the pinned scanner archive before extraction.
        trivy_dir="$(mktemp -d "$RUNNER_TEMP/openmed-trivy.XXXXXX")"
        archive="$trivy_dir/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl --fail --silent --show-error --location \
          --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
          --header 'Accept: application/octet-stream' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          --output "$archive" \
          "https://api.github.com/repos/aquasecurity/trivy/releases/assets/${TRIVY_LINUX_X64_ASSET_ID}"
        echo "$TRIVY_SHA256  $archive" | sha256sum --check --status
        tar --extract --gzip --file "$archive" --directory "$trivy_dir" trivy
        chmod 755 "$trivy_dir/trivy"
        "$trivy_dir/trivy" --version
        echo "$trivy_dir" >> "$GITHUB_PATH"
