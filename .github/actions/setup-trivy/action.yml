name: Set up pinned Trivy
description: Install the pinned Trivy release binary after verifying its SHA-256 checksum

runs:
  using: composite
  steps:
    - name: Install Trivy
      shell: bash
      env:
        TRIVY_VERSION: "0.76.1"
        TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
      run: |
        # Pin the scanner binary; vulnerability databases still refresh normally.
        # Download from the release directly, without an extra redirect service.
        trivy_dir="$(mktemp -d "$RUNNER_TEMP/openmed-trivy.XXXXXX")"
        archive="$trivy_dir/trivy.tar.gz"
        curl --fail --silent --show-error --location \
          --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
          --output "$archive" \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        echo "$TRIVY_SHA256  $archive" | sha256sum --check --status
        tar --extract --gzip --file "$archive" --directory "$trivy_dir" trivy
        chmod 755 "$trivy_dir/trivy"
        "$trivy_dir/trivy" --version
        echo "$trivy_dir" >> "$GITHUB_PATH"
